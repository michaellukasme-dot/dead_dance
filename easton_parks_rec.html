function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var map, MK=[], ACT="";
function boot(){
  map=L.map('map',{zoomControl:true,attributionControl:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:20,subdomains:'abcd',crossOrigin:true}).addTo(map);
  var lats=FAC.map(function(f){return f.lat;}), lngs=FAC.map(function(f){return f.lng;});
  map.fitBounds([[Math.min.apply(0,lats),Math.min.apply(0,lngs)],[Math.max.apply(0,lats),Math.max.apply(0,lngs)]],{paddingTopLeft:[344,20],paddingBottomRight:[24,54]});

function buildPills(){
  var types=Object.keys(TYPE).filter(function(t){return FAC.some(function(f){return f.t===t;});});
  var html='<span class="cat'+(ACT===''?' on':'')+'" onclick="pick(\'\')">📍 All</span>';

}
function pick(t){ ACT=(ACT===t?'':t); buildPills(); apply(); renderList(); }
function apply(){ FAC.forEach(function(f,i){ var show=(ACT===''||f.t===ACT); if(show){ if(!map.hasLayer(MK[i]))MK[i].addTo(map);} else if(map.hasLayer(MK[i]))map.removeLayer(MK[i]); }); }
function renderList(){

}
