<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MusikFest Band — DeadDance</title>
<meta name="theme-color" content="#2a1b3d">
<style>
/* mf_band.html — the Dead & Jam band event page. DeadDance palette (branded, on purpose).
   Modeled on the DSO · ArtsQuest historical page (mf_cafe) — but the DSO show was HISTORICAL;
   these are FUTURE, and the page LIVES THROUGH the show:
       FUTURE  → LIVE (on now) → CLOSEOUT → HISTORICAL (frozen archive).
   The pills change with the state. ?band=<slug>  (rift | life-after-dead | shakedown-citi | liberty-jams)
   Test states with ?state=future|live|historical  or  ?now=2026-08-03T21:30  */
:root{--purple:#2a1b3d;--purple2:#3d2a57;--rose:#b8002e;--gold:#f0a500;--ink:#1a1320;--muted:#7a7285;--line:#ece7f2;--bg:#faf8fc;--card:#fff}
*{box-sizing:border-box}html,body{margin:0}
body{font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:0 15px 90px}
.hero{position:relative;overflow:hidden;background:radial-gradient(130% 90% at 50% 0%,var(--purple2),var(--purple) 62%);color:#fff;border-radius:0 0 22px 22px;padding:26px 20px 22px;text-align:center}
.hero .rose{font-size:22px}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.28em;color:#e7c8ff;text-transform:uppercase}
.bname{font-size:30px;font-weight:900;margin:7px 0 2px;line-height:1.05;letter-spacing:-.3px}
.kind{font-size:12.5px;font-weight:700;color:#c9b6e8}
.statebar{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:8px 15px;border-radius:999px;font-weight:800;font-size:13px}
.st-future{background:#f0a50022;color:#ffd27a;border:1px solid #f0a50055}
.st-live{background:#b8002e;color:#fff;box-shadow:0 0 0 0 #b8002e;animation:pulse 1.8s infinite}
.st-hist{background:#ffffff1c;color:#d8cbef;border:1px solid #ffffff33}
@keyframes pulse{0%{box-shadow:0 0 0 0 #b8002e88}70%{box-shadow:0 0 0 12px #b8002e00}100%{box-shadow:0 0 0 0 #b8002e00}}
.count{font-variant-numeric:tabular-nums}
.set{margin-top:12px;font-size:13.5px;color:#e9def7;font-weight:600}
.set b{color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.pill{border:0;cursor:pointer;font-weight:800;font-size:13px;padding:10px 15px;border-radius:999px;background:#ffffff18;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pill.gold{background:linear-gradient(180deg,#ffce6b,var(--gold));color:#3a1d00}
.pill.rose{background:var(--rose);color:#fff}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;margin-top:14px}
.sec h2{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.roster{display:flex;flex-direction:column;gap:2px}
.mrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #f4f0fa;font-size:14.5px}
.mrow:last-child{border-bottom:0}.mrow b{font-weight:800}.mrow span{color:var(--muted);font-weight:600;font-size:13px;text-align:right}
.tease{display:flex;flex-wrap:wrap;gap:7px}
.song{background:#f5f0fb;color:#4a2f6e;border-radius:9px;padding:6px 11px;font-size:13px;font-weight:700}
.muted{color:var(--muted);font-size:13.5px}
.qrcard{display:flex;gap:15px;align-items:center}
.qrbox{width:118px;height:118px;flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.qrcard .cap b{display:block;font-size:15px;margin-bottom:3px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.links a{font-size:12.5px;font-weight:700;color:var(--purple2);text-decoration:none;background:#f2ecf9;border-radius:8px;padding:6px 10px}
.foot{margin-top:20px;text-align:center;color:var(--muted);font-size:12px}
.foot .rose{color:var(--rose)}
/* Coming-shows modal — terse */
.mbg{position:fixed;inset:0;background:#1a132099;display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.mbg.on{display:flex}
.modal{background:#fff;width:100%;max-width:600px;border-radius:18px 18px 0 0;padding:16px 17px calc(20px + env(safe-area-inset-bottom,0));max-height:80vh;overflow:auto}
.modal h3{margin:2px 0 3px;font-size:17px}.modal .sub{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.gig{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #f4f0fa;font-size:14px}
.gig:last-child{border-bottom:0}.gig .d{font-weight:800;color:var(--purple2);white-space:nowrap}
.gig .v{text-align:right;color:var(--ink)}.gig .v small{display:block;color:var(--muted);font-size:12px}
.mclose{width:100%;margin-top:12px;border:0;background:#f2ecf9;color:var(--purple2);font-weight:800;border-radius:12px;padding:12px;cursor:pointer;font-size:14px}
.badge{display:inline-block;font-size:10.5px;font-weight:800;color:#8a6d00;background:#fff3d6;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.hostbadge{display:inline-block;font-size:11.5px;font-weight:800;color:var(--purple2);background:#f2ecf9;border-radius:8px;padding:6px 11px;margin-bottom:10px}
.tixbtn{display:block;width:100%;text-align:center;border:0;cursor:pointer;font-weight:800;font-size:15px;padding:13px;border-radius:12px;margin-bottom:8px;background:linear-gradient(180deg,#ffce6b,var(--gold));color:#3a1d00}
.tixbtn[data-free="1"]{background:#eef6f0;color:#12854f}
.legal{font-size:11px;color:var(--muted);margin-top:4px}.legal a{color:var(--purple2);font-weight:700}
.slphone{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit;font-size:15px;margin:4px 0 8px}
.slbtn{width:100%;border:0;cursor:pointer;font-weight:800;font-size:15px;padding:13px;border-radius:12px;background:var(--rose);color:#fff}
.slbtn.ghost{background:#f2ecf9;color:var(--purple2)}
.slbtn.go{background:#12854f}
#slBody .say{font-size:13.5px;color:var(--ink);margin:2px 0 10px}
.slrow{display:flex;gap:10px;margin:10px 0}
.slrow label{flex:1;font-size:11.5px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.slrow input{border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;font-size:14px}
.slta{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font:inherit;font-size:14px;resize:vertical;margin-bottom:8px}
.slgig{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f4f0fa;font-size:14px}
.slgig .d{font-weight:800;color:var(--purple2);white-space:nowrap;min-width:66px}
.slgig input.slAt{border:1px solid var(--line);border-radius:8px;padding:5px 7px;font:inherit;font-size:13px;width:104px}
.slbandlink{margin-top:12px;font-size:12px}.slbandlink a{color:var(--purple2);font-weight:800;text-decoration:none}
.slrem{background:#fff3d6;border:1px solid #f0d9a6;border-left:4px solid var(--gold);border-radius:12px;padding:11px 13px;font-size:13.5px;color:#6a5410;margin:12px 0}
.slrem a{color:var(--rose);font-weight:800;text-decoration:none;white-space:nowrap}
</style>
</head>
<body>
<div class="hero">
  <div class="rose">🌹</div>
  <div class="eyebrow" id="eyebrow">Musikfest 2026 · Bethlehem</div>
  <div class="bname" id="bname">—</div>
  <div class="kind" id="kind"></div>
  <div id="statebar"></div>
  <div class="set" id="setline"></div>
  <div class="pills" id="pills"></div>
</div>

<div class="wrap">
  <div id="slRemSlot" style="display:none"></div>

  <div class="sec" id="teaseSec" style="display:none">
    <h2 id="teaseHead">Setlist tease</h2>
    <div class="tease" id="tease"></div>
  </div>

  <div class="sec" id="rosterSec">
    <h2>The roster</h2>
    <div class="roster" id="roster"></div>
  </div>

  <div id="tixSlot"></div>

  <div class="sec" id="qrSec">
    <div class="qrcard">
      <div class="qrbox"><div id="walkQR">▦</div></div>
      <div class="cap">
        <b id="qrTitle">Walk to the stage</b>
        <div class="muted" id="qrSub">Tap to open · or scan from another phone — turn-by-turn from wherever you are.</div>
      </div>
    </div>
  </div>

  <div class="sec" id="linksSec">
    <h2>Find them</h2>
    <div class="links" id="links"></div>
  </div>

  <div class="foot">From Bethlehem · launched in Bethlehem <span class="rose">🌹</span><br>
    <span class="muted" id="conf"></span></div>
</div>

<!-- Coming shows — terse modal -->
<div class="mbg" id="mbg" onclick="if(event.target===this)csClose()">
  <div class="modal">
    <h3 id="csTitle">Coming shows</h3>
    <div class="sub" id="csSub"></div>
    <div id="csList"></div>
    <button class="mclose" onclick="csClose()">Close</button>
  </div>
</div>

<!-- Set List — shows the setlist if the band configured one, else a fan-registration prompt -->
<div class="mbg" id="slbg" onclick="if(event.target===this)slClose()">
  <div class="modal">
    <div id="slBody"></div>
    <button class="mclose" onclick="slClose()">Close</button>
  </div>
</div>

<script src="qr.js"></script>
<script src="dd_qrmark.js"></script>
<script src="dd_mf_bands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="dd_notify.js"></script>
<script src="dd_setlist_reminder.js"></script>
<script>
/* StageFill ticketing spine — same client + endpoints as event_page.html. A band that lets us
   sell tickets gets the full treatment: Pre-Event (tickets on sale) → Live (doors) → Historical. */
var SF_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYnFmenhocnF4cHdnaWRvZ2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDUzODUsImV4cCI6MjA5Nzk4MTM4NX0.aa2guYvXJ7SLAEdYOpDKb6xzHP-ypMpZFPFSdwLc6xM",
    SF_CHECKOUT="https://vmbqfzxhrqxpwgidogfm.supabase.co/functions/v1/sf-checkout";
(function(){ try{ var C=window.supabase.createClient("https://vmbqfzxhrqxpwgidogfm.supabase.co", SF_ANON); window.ddClient=function(){return C;}; }catch(e){} })();
window.SL_SMS_NUMBER="";  // set to your Twilio number (e.g. "+1 610-555-0100") to show fans the confirm-by-text step

/* ---- band seed: shared dd_mf_bands.js (single source), with the inline copy as a safety fallback ---- */
var BANDS=window.DD_MF_BANDS||{
  "rift":{name:"Rift",kind:"Philadelphia Phish Tribute",home:"Philadelphia, PA",
    members:[{n:"Sean Coyne",r:"Guitar"},{n:"John Hildenbrand",r:"Keys"},{n:"Matt Agostini",r:"Bass"},{n:"Matt Elberson",r:"Drums"}],
    set:{date:"2026-08-05",time:"",stage:""}, /* on lineup; day/stage TBD */
    tease:[], recording:null,
    links:{Website:"https://riftphilly.com/",Instagram:"https://www.instagram.com/riftphilly/",Facebook:"https://www.facebook.com/riftphilly/",YouTube:"https://www.youtube.com/@RiftPhilly"},
    coming:[{d:"Aug 15, 2026",v:"Concerts Under the Stars",c:"King of Prussia, PA"}],
    conf:"Lineup confirmed via riftphilly.com."},
  "life-after-dead":{name:"Life After Dead",kind:"Grateful Dead Tribute",home:"Bethlehem, PA",
    members:[{n:"Rich Jeffreys",r:"Lead vocals & guitar"},{n:"Jon Fadem",r:"Lead guitar & vocals"},{n:"Dave Johnsen",r:"Bass & vocals"},{n:"Zach Martin",r:"Drums"}],
    set:{date:"",time:"",stage:"",note:"Festival set to confirm"}, /* Café date Jun 27 — festival TBD */
    tease:[], recording:null,
    links:{Website:"https://www.reverbnation.com/lifeafterdead1",Facebook:"https://www.facebook.com/lifeafterdeadband",Instagram:"https://www.instagram.com/lifeafterdeadband/"},
    coming:[{d:"Jun 27, 2026",v:"Musikfest Café at SteelStacks",c:"Bethlehem, PA"}],
    conf:"Lineup confirmed via ArtsQuest. Festival set date to confirm with band."},
  "shakedown-citi":{name:"Shakedown Citi",kind:"Grateful Dead / Jam",home:"New York, NY",
    members:[], /* not published — awaiting band */
    set:{date:"2026-08-03",time:"",stage:""},
    tease:[], recording:null,
    links:{Website:"https://www.shakedownciti.com/",Instagram:"https://www.instagram.com/shakedownciti/",Facebook:"https://www.facebook.com/shakedownciti",Spotify:"https://open.spotify.com/artist/642FvT9DfSxEEAORYWqPmq",Bandsintown:"https://www.bandsintown.com/a/15537374-shakedown-citi"},
    coming:[{d:"Jul 29, 2026",v:"The Warehouse",c:"Amityville, NY"},{d:"Aug 1, 2026",v:"Jerry Jam 20",c:"Middle Island, NY"},{d:"Aug 5, 2026",v:"Westcott Theater",c:"Syracuse, NY"},{d:"Aug 6, 2026",v:"Bearsville Theater",c:"Woodstock, NY"},{d:"Aug 7, 2026",v:"FTC StageOne",c:"Fairfield, CT"}],
    conf:"Set: Aug 3. Roster not yet published — awaiting the band."},
  "liberty-jams":{name:"Liberty Jams",kind:"Jam Band",home:"",
    members:[],
    set:{date:"2026-08-05",time:"",stage:""},
    tease:[], recording:null,
    links:{},
    coming:[],
    conf:"Set: Aug 5. No public roster or links found — awaiting the band."},
  /* SAMPLE of the ticketed treatment — a band that lets us sell tickets for their OWN show.
     Real checkout activates when the band enables ticketing (or pass ?ev=<slug> for a live event). */
  "demo-ticketed":{name:"Your Band",kind:"Ticketed headline show · sample",home:"Bethlehem, PA",
    members:[{n:"— your lineup —",r:"appears here"}],
    ticketed:true, host:"managed",
    set:{date:"2026-09-19",time:"8:00 PM",stage:"The Foundry · SteelStacks"},
    tickets:[{name:"General Admission",price_cents:2500,sample:true},{name:"Free RSVP",price_cents:0,sample:true}],
    tease:[], recording:null,
    links:{},
    coming:[],
    conf:"Sample of the ticketed treatment. Real Stripe checkout goes live when the band turns on ticketing."}
};

function P(k){return new URLSearchParams(location.search).get(k);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var slug=(P('band')||'rift').toLowerCase();
var B=BANDS[slug]||BANDS['rift'];
var MAP='https://deaddance.app/musikfest.html'; /* the live festival map — walking directions */
var walkUrl=MAP+(B.set&&B.set.stage?('#stage='+encodeURIComponent(B.set.stage)):'');
/* the free FULL ticket for this show — the collectible stub, appended to the fan's deck (ticket.html).
   The ticket's SHOW QR points at THIS event page (stateful), so one code carries the holder through
   pre-show → during (song texts) → after (historical/closed). Same QR, evolving destination. */
function tixColor(s){ var m={'rift':'#00a3a3','life-after-dead':'#b8002e','shakedown-citi':'#5a2e86','liberty-jams':'#e8730c','demo-ticketed':'#2f7bf6'}; return m[s]||'#5a2e86'; }
function tixUrl(){ var when=(B.set&&B.set.date)?fmtDate(B.set.date):'';
  var origin=(location.origin.indexOf('http')===0?location.origin:'https://deaddance.app');
  var ev=origin+'/mf_band.html?band='+encodeURIComponent(slug);
  return 'ticket.html?band='+encodeURIComponent(B.name)+'&sub='+encodeURIComponent(B.kind||'Dead & Jam')
    +'&venue='+encodeURIComponent('MusikFest 2026 · Bethlehem, PA')+'&date='+encodeURIComponent(when)
    +'&iso='+encodeURIComponent((B.set&&B.set.date)||'')+'&price=Free&gate='+encodeURIComponent((B.set&&B.set.stage)||'MusikFest')
    +'&ev='+encodeURIComponent(ev)+'&color='+encodeURIComponent(tixColor(slug)); }

/* ---- state machine: FUTURE → LIVE → HISTORICAL ---- */
function setBounds(){
  if(!B.set||!B.set.date) return null;
  var t=B.set.time||'8:00 PM';
  var start=new Date(B.set.date+'T'+to24(t));
  var end=new Date(start.getTime()+2*60*60*1000); /* ~2h set */
  return {start:start,end:end};
}
function to24(t){ var m=/(\d+):(\d+)\s*(AM|PM)?/i.exec(t||''); if(!m) return '20:00:00';
  var h=+m[1],mi=m[2],ap=(m[3]||'').toUpperCase(); if(ap==='PM'&&h<12)h+=12; if(ap==='AM'&&h===12)h=0; return (h<10?'0':'')+h+':'+mi+':00'; }
function now(){ var o=P('now'); return o?new Date(o):new Date(); }
function state(){
  var forced=P('state'); if(forced) return forced;
  var b=setBounds(); if(!b) return 'future';           /* no date yet → treat as upcoming */
  var n=now(); if(n<b.start) return 'future'; if(n<=b.end) return 'live'; return 'historical';
}

function render(){
  document.getElementById('bname').textContent=B.name;
  document.getElementById('kind').textContent=B.kind+(B.home?(' · '+B.home):'');
  document.title=B.name+' — MusikFest 2026';

  /* TIER:  less ($0, just listed) · more ($20, full purple page) · most ($30, own background). */
  var TIER=(P('tier')||B.tier||'more').toLowerCase();
  if(TIER==='less'){ renderListed(); return; }

  var S=state();

  /* MOST tier ($30): the band's own image replaces the purple hero; a dark scrim keeps the name
     + pills legible on top. Ignored on lower tiers (the upgrade is what unlocks it). */
  var bg=B.bg||P('bg'), hero=document.querySelector('.hero');
  if(TIER==='most' && bg && /^https?:\/\//i.test(bg) && hero){
    var safe=encodeURI(bg).replace(/["\\]/g,'');
    hero.style.backgroundImage="linear-gradient(180deg,rgba(20,13,26,.40),rgba(20,13,26,.84)),url(\""+safe+"\")";
    hero.style.backgroundSize="cover"; hero.style.backgroundPosition="center";
  }

  /* state bar + set line */
  var sb=document.getElementById('statebar'), sl=document.getElementById('setline');
  var setTxt = B.set&&B.set.date ? fmtDate(B.set.date)+(B.set.time?(' · '+B.set.time):' · time TBD')+(B.set.stage?(' · '+B.set.stage):'') : 'Festival set — date to confirm';
  if(S==='future'){
    sb.innerHTML='<span class="statebar st-future">⏳ <span class="count" id="cd">Upcoming</span></span>';
    sl.innerHTML='<b>'+esc(setTxt)+'</b>';
    tick();
  }else if(S==='live'){
    sb.innerHTML='<span class="statebar st-live">🌹 ON NOW — playing</span>';
    sl.innerHTML='<b>'+esc(setTxt)+'</b>';
  }else{
    sb.innerHTML='<span class="statebar st-hist">✓ Played · '+esc(B.set&&B.set.date?fmtDate(B.set.date):'MusikFest 2026')+'</span>';
    sl.innerHTML='<span style="color:#d8cbef">This set is now history — the archive below is frozen.</span>';
  }

  /* pills differ by state */
  var pills=[];
  var walk='<a class="pill gold" href="'+esc(walkUrl)+'" target="_blank" rel="noopener">🗺 Walk to the stage</a>';
  var coming=(B.coming&&B.coming.length)?'<button class="pill" onclick="csOpen()">📅 Coming shows</button>':'';
  if(S==='future'){
    if(B.ticketed && B.tickets && B.tickets.length){
      pills.push('<button class="pill gold" onclick="document.getElementById(\'tixSlot\').scrollIntoView({behavior:\'smooth\'})">🎟 Get tickets</button>');
    } else {
      pills.push('<a class="pill rose" href="'+esc(tixUrl())+'" target="_blank" rel="noopener">🎟 Get your free ticket</a>');
    }
    pills.push(walk); pills.push(coming);
  }else if(S==='live'){
    pills.push('<a class="pill rose" href="'+esc(tixUrl())+'" target="_blank" rel="noopener">🎟 Get your free ticket</a>');
    pills.push(walk);
    pills.push('<a class="pill" href="'+esc(MAP)+'" target="_blank" rel="noopener">📸 Surround the stage</a>');
    pills.push(coming);
  }else{
    if(B.recording) pills.push('<a class="pill rose" href="'+esc(B.recording)+'" target="_blank" rel="noopener">▶ Recording</a>');
    pills.push(coming);
  }
  pills.push('<button class="pill" onclick="slOpen()">🎵 Set List</button>');   // setlist / live-text-me pill on every state
  document.getElementById('pills').innerHTML=pills.filter(Boolean).join('');

  /* setlist tease (or, historical, "the setlist that night") */
  var ts=document.getElementById('teaseSec'), th=document.getElementById('teaseHead'), tw=document.getElementById('tease');
  if(B.tease&&B.tease.length){
    ts.style.display=''; th.textContent=(S==='historical'?'The setlist':'Setlist tease');
    tw.innerHTML=B.tease.map(function(s){return '<span class="song">'+esc(s)+'</span>';}).join('');
  } else { ts.style.display='none'; }

  /* roster */
  var r=document.getElementById('roster');
  if(B.members&&B.members.length){
    r.innerHTML=B.members.map(function(m){return '<div class="mrow"><b>'+esc(m.n)+'</b><span>'+esc(m.r)+'</span></div>';}).join('');
  } else {
    r.innerHTML='<div class="muted">Roster coming soon — we’ve reached out to the band. <span class="badge">awaiting band</span></div>';
  }

  /* QR title by state */
  document.getElementById('qrTitle').textContent = S==='historical' ? 'Relive the map' : 'Walk to the stage';

  /* links */
  var ls=document.getElementById('links'), keys=Object.keys(B.links||{});
  ls.innerHTML = keys.length ? keys.map(function(k){return '<a href="'+esc(B.links[k])+'" target="_blank" rel="noopener">'+esc(k)+'</a>';}).join('') : '<span class="muted">Links coming soon.</span>';

  document.getElementById('conf').textContent=B.conf||'';

  /* tickets — StageFill buy spine. Pre-Event + Live (door); Historical shows none. */
  var tix=document.getElementById('tixSlot'); tix.innerHTML='';
  if(B.ticketed && (S==='future'||S==='live') && B.tickets && B.tickets.length){
    var hostBadge=(B.host==='self')?'🎟 Tickets by the band · Pro ($20/mo)':'🎟 Tickets by DeadDance · managed';
    var rows=B.tickets.map(function(t){ var pr=t.price_cents||0; var lbl=pr>0?('Buy '+esc(t.name)+' — $'+(pr/100).toFixed(0)):('Free — '+esc(t.name));
      return '<button class="tixbtn sftix" data-tt="'+esc(String(t.id||''))+'" data-free="'+(pr>0?'0':'1')+'" data-sample="'+(t.sample?'1':'0')+'">'+lbl+'</button>'; }).join('');
    tix.innerHTML='<div class="sec"><h2>Tickets</h2><div class="hostbadge">'+hostBadge+'</div>'+rows
      +'<div class="legal">By reserving or buying you agree to our <a href="terms.html">Terms</a>, <a href="privacy_policy.html">Privacy</a> &amp; <a href="refunds.html">Refunds</a>.</div></div>';
  }

  /* the QR — UNBRANDED, and ALWAYS a clickable link behind it (dual-door: tap to open · scan to share) */
  try{ if(window.DDQR&&DDQR.into){ DDQR.into('walkQR', walkUrl, {size:360, css:118, caption:false, mark:false, link:true}); }
       else { document.getElementById('walkQR').textContent='QR'; } }catch(e){ document.getElementById('walkQR').textContent='QR'; }
}

/* LESS tier ($0) — just in the festival list, like the non-Dead acts. A compact card, no full page. */
function renderListed(){
  var setTxt=(B.set&&B.set.date)?fmtDate(B.set.date)+(B.set.stage?(' · '+B.set.stage):''):'MusikFest 2026';
  document.getElementById('statebar').innerHTML='<span class="statebar st-future">🌹 Playing MusikFest 2026</span>';
  document.getElementById('setline').innerHTML='<b>'+esc(setTxt)+'</b>';
  document.getElementById('pills').innerHTML='<a class="pill rose" href="'+esc(MAP)+'" target="_blank" rel="noopener">🗺 See the full lineup</a>';
  ['teaseSec','rosterSec','tixSlot','qrSec','linksSec'].forEach(function(id){ var e=document.getElementById(id); if(e)e.style.display='none'; });
  document.getElementById('conf').textContent='Listed at MusikFest — upgrade to MORE ($20) for a full band page.';
}

function fmtDate(iso){ try{ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric'}); }catch(e){ return iso; } }
function tick(){ var el=document.getElementById('cd'); if(!el) return; var b=setBounds(); if(!b){ el.textContent='Upcoming'; return; }
  var ms=b.start-now(); if(ms<=0){ el.textContent='Starting…'; return; }
  var d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5), m=Math.floor(ms%36e5/6e4);
  el.textContent=(d>0?d+'d ':'')+h+'h '+m+'m to set'; setTimeout(tick,60000); }

/* coming-shows terse modal */
window.csOpen=function(){ var l=document.getElementById('csList');
  document.getElementById('csTitle').textContent=B.name+' — coming shows';
  document.getElementById('csSub').textContent=(B.coming.length)+' upcoming · tap a venue to look it up';
  l.innerHTML=B.coming.map(function(g){ return '<div class="gig"><span class="d">'+esc(g.d)+'</span><span class="v">'+esc(g.v)+'<small>'+esc(g.c)+'</small></span></div>'; }).join('');
  document.getElementById('mbg').classList.add('on'); };
window.csClose=function(){ document.getElementById('mbg').classList.remove('on'); };

/* ===== Set List — ONE clean pill, terse modal. Fans get each song texted live; a BAND MEMBER
   builds & auto-schedules the list (same pill, contextual — no separate band button). ===== */
function slIsBand(){ return P('role')==='band'||P('member')==='1'||P('bandmode')==='1'; }
function slGet(){ try{ var ls=(JSON.parse(localStorage.getItem('dd.setlist')||'{}'))[slug]; if(ls) return ls; }catch(e){} return B.setlist||null; }
function slPut(o){ try{ var all=JSON.parse(localStorage.getItem('dd.setlist')||'{}'); all[slug]=o; localStorage.setItem('dd.setlist',JSON.stringify(all)); }catch(e){} B.setlist=o; }
function slVal(id){ var e=document.getElementById(id); return e?e.value:''; }
function hm2m(s){ var p=String(s||'').split(':'); return (+p[0]||0)*60+(+p[1]||0); }
function m2hm(m){ m=((m%1440)+1440)%1440; var h=Math.floor(m/60), mi=m%60; return (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi; }
function to24hm(t){ var x=/(\d+):(\d+)\s*(AM|PM)?/i.exec(t||''); if(!x) return ''; var h=+x[1],mi=x[2],ap=(x[3]||'').toUpperCase(); if(ap==='PM'&&h<12)h+=12; if(ap==='AM'&&h===12)h=0; return (h<10?'0':'')+h+':'+mi; }
function fmt12(hm){ var m=hm2m(hm), h=Math.floor(m/60), mi=m%60, ap=h<12?'AM':'PM', h12=((h+11)%12)+1; return h12+':'+(mi<10?'0':'')+mi+' '+ap; }

window.slOpen=function(){
  var saved=slGet();
  if(slIsBand()) slEditor(saved);
  else if(saved&&saved.songs&&saved.songs.length) slFanList(saved);
  else slFanForm();
  document.getElementById('slbg').classList.add('on');
};
window.slClose=function(){ document.getElementById('slbg').classList.remove('on'); };

/* fan: register for live song-by-song texts */
function slFanForm(){
  document.getElementById('slBody').innerHTML='<h3>'+esc(B.name)+' — Set List</h3>'
    +'<div class="sub">If '+esc(B.name)+' permits, we text you the set list as they play each song.</div>'
    +'<div class="say">Register as a '+esc(B.name)+' fan to receive the setlist as they play each song — every tune lands on your phone the moment it starts.</div>'
    +'<input class="slphone" id="slPhone" type="tel" inputmode="tel" placeholder="Your mobile number" autocomplete="tel">'
    +'<button class="slbtn" onclick="slRegister()">🎵 Text me the setlist</button>'
    +'<div class="legal">You’re asking '+esc(B.name)+' to text you their live setlist. You’ll confirm by text from your phone; '+esc(B.name)+' controls whether texts are sent; message &amp; data rates may apply — reply STOP to opt out anytime.</div>'
    +'<div class="slbandlink"><a href="#" onclick="slEditor(slGet());return false;">🎤 In the band? Build your live setlist →</a></div>';
}
window.slRegister=function(){
  var el=document.getElementById('slPhone'), digits=((el&&el.value)||'').replace(/[^0-9]/g,'');
  if(digits.length<10){ if(el){ el.style.borderColor='#b8002e'; el.focus(); } return; }
  try{ var k='dd.setlistfans', o=JSON.parse(localStorage.getItem(k)||'{}'); (o[slug]=o[slug]||[]).push({t:Date.now()}); localStorage.setItem(k,JSON.stringify(o)); }catch(e){}   // no PII cached
  try{ if(window.DDJoin&&DDJoin.track) DDJoin.track('setlist_fan',{band:slug}); }catch(e){}   // no phone to analytics
  var body=document.getElementById('slBody');
  // TRUTHFUL: "🌹 One more step" shows ONLY when the pending row actually reaches the server (v2 sends only on
  // .then/.catch). On reject/offline we do NOT claim they're subscribed — we tell them honestly how to still get in.
  function step(){ var confirmLine = window.SL_SMS_NUMBER
      ? 'Text <b>START</b> to <b>'+esc(SL_SMS_NUMBER)+'</b> from your phone to confirm'
      : 'You’ll confirm with a quick text from your phone';
    if(body) body.innerHTML='<h3>🌹 One more step</h3><div class="sub">Almost in — '+confirmLine+'. Then each song lands live as '+esc(B.name)+' plays it. Reply STOP anytime.</div>'; }
  function fail(status, err){ var msg=(status===false&&err&&(err.message||err.hint||err.code))||'';
    var alt = window.SL_SMS_NUMBER ? ' — or just text <b>START</b> to <b>'+esc(SL_SMS_NUMBER)+'</b> from your phone to get in directly' : '';
    if(body) body.innerHTML='<h3>⚠️ We couldn’t register you</h3><div class="sub">Your number did NOT reach us'+(msg?(' (server said: '+esc(msg)+')'):' just now')+'. Please try again in a moment'+alt+'.</div>'; }
  try{ var cl=window.ddClient&&ddClient();
    if(cl&&cl.rpc){ cl.rpc('dd_setlist_fan_pending',{p_band:slug,p_phone:slE164(digits),p_source:'web'})   // PENDING → confirmed only when they text
      .then(function(r){ if(r&&r.error) fail(false, r.error); else step(); })
      .catch(function(e){ fail(null, e); });
      return; } }catch(e){}
  fail(null);   // no server reachable — do NOT claim they're subscribed
};
function slE164(d){ d=String(d||'').replace(/[^0-9]/g,''); if(d.length===10) return '+1'+d; if(d.length===11&&d.charAt(0)==='1') return '+'+d; return '+'+d; }

/* fan: the scheduled setlist (terse rows: time · song), with a register CTA while upcoming/live */
function slFanList(saved){
  var hist=state()==='historical';
  document.getElementById('slBody').innerHTML='<h3>'+esc(B.name)+' — Set List</h3>'
    +'<div class="sub">'+(hist?'The set they played':'Each song texts you the moment they play it')+'</div>'
    + saved.songs.map(function(r){ return '<div class="slgig"><span class="d">'+esc(r.at?fmt12(r.at):'')+'</span><span>'+esc(r.n)+'</span></div>'; }).join('')
    + (hist?'':'<button class="slbtn" style="margin-top:12px" onclick="slFanForm()">🎵 Text me each song live</button>')
    +'<div class="slbandlink"><a href="#" onclick="slEditor(slGet());return false;">🎤 In the band? Edit the setlist →</a></div>';
}

/* band member: build + auto-schedule the texts to match the set window */
window.slEditor=function(saved){
  var st=(saved&&saved.win&&saved.win.s)|| to24hm(B.set&&B.set.time) || '12:00';
  var en=(saved&&saved.win&&saved.win.e)|| m2hm(hm2m(st)+60);
  var songs=(saved&&saved.songs)? saved.songs.map(function(x){return x.n;}).join('\n') : '';
  document.getElementById('slBody').innerHTML='<h3>'+esc(B.name)+' — build your Set List</h3>'
    +'<div class="sub">No rush — even in the van on the way up. Type your songs, or paste the text you’d fire off — set your slot and we time each fan text for you.</div>'
    +'<div class="slrow"><label>On stage<input type="time" id="slStart" value="'+esc(st)+'"></label><label>Off stage<input type="time" id="slEnd" value="'+esc(en)+'"></label></div>'
    +'<textarea id="slSongs" class="slta" rows="7" placeholder="One song per line, in order:\nSuzy Greenberg\nTweezer\nYou Enjoy Myself" oninput="slAutoTime()">'+esc(songs)+'</textarea>'
    +'<button class="slbtn ghost" onclick="slAutoTime()">⏱ Auto-time the texts</button>'
    +'<div class="sub" style="margin-top:14px">…or just paste your text reply</div>'
    +'<textarea id="slText" class="slta" rows="3" placeholder="Suzy Greenberg 2:30, Wolfmans Brother 4:55, Tweezer 9:10 …"></textarea>'
    +'<button class="slbtn ghost" onclick="slFromText()">📩 Fill from text</button>'
    +'<div id="slSched"></div>'
    +'<button class="slbtn go" style="margin-top:10px" onclick="slSaveSet()">✓ Save &amp; schedule</button>';
  if(saved&&saved.songs&&saved.songs.length) slRenderSched(saved.songs); else slAutoTime();
};
/* parse a free-text / SMS reply → songs with durations → cumulative start times from the set start.
   "Suzy Greenberg 2:30, Wolfmans Brother 4:55" → each song's text fires when it starts.
   (Same parser a Twilio inbound-SMS webhook would call server-side.) */
function slParseText(text, startHM){
  var start=hm2m(startHM||'12:00'), items=String(text||'').split(/[,\n;]+/).map(function(s){return s.trim();}).filter(Boolean), rows=[], cumSec=0;
  items.forEach(function(it){
    var durSec=0, name=it, m=it.match(/(\d{1,2}):(\d{2})/);
    if(m){ durSec=(+m[1])*60+(+m[2]); name=it.slice(0,m.index); }
    else { var m2=it.match(/(\d{1,3})\s*(?:minutes?|mins?|m)\b/i); if(m2){ durSec=(+m2[1])*60; name=it.slice(0,m2.index); } }
    name=name.replace(/[-–—:]+$/,'').replace(/\b(?:minutes?|mins?)\b/ig,'').trim();
    if(!name) return;
    rows.push({ n:name, at:m2hm(start+Math.round(cumSec/60)) });
    cumSec += durSec || 240;   // default 4 min if a duration wasn't given
  });
  return rows;
}
window.slFromText=function(){
  var rows=slParseText(slVal('slText'), slVal('slStart')||'12:00'); if(!rows.length) return;
  document.getElementById('slSongs').value=rows.map(function(r){return r.n;}).join('\n');
  slRenderSched(rows);
};
function slSongsNow(){ return (slVal('slSongs')||'').split('\n').map(function(x){return x.trim();}).filter(Boolean); }
window.slAutoTime=function(){
  var songs=slSongsNow(), sMin=hm2m(slVal('slStart')||'12:00'), eMin=hm2m(slVal('slEnd')||'13:00');
  if(eMin<=sMin) eMin=sMin+60; var n=songs.length, W=eMin-sMin;
  slRenderSched(songs.map(function(nm,i){ return {n:nm, at:m2hm(sMin+Math.round((i+1)*W/(n+1)))}; }));
};
function slRenderSched(rows){
  document.getElementById('slSched').innerHTML = rows.length
    ? '<div class="sub" style="margin-top:10px">Texts fire at:</div>'+rows.map(function(r,i){ return '<div class="slgig"><input type="time" class="slAt" data-i="'+i+'" value="'+esc(r.at||'')+'"><span>'+esc(r.n)+'</span></div>'; }).join('')
    : '';
}
window.slSaveSet=function(){
  var songs=slSongsNow(); if(!songs.length) return;
  var ats=[].slice.call(document.querySelectorAll('#slSched .slAt'));
  var out=songs.map(function(nm,i){ return {n:nm, at:(ats[i]&&ats[i].value)||''}; });
  slPut({win:{s:slVal('slStart'),e:slVal('slEnd')}, songs:out});   // local save — drives THIS ticket immediately
  try{ if(window.DDJoin&&DDJoin.track) DDJoin.track('setlist_set',{band:slug,songs:out.length}); }catch(e){}
  var body=document.getElementById('slBody'), n=out.length;
  // TRUTHFUL: "scheduled — fans get each texted" implies a SERVER schedule, so it shows ONLY on a confirmed
  // server upsert (token-gated; needs ?key=<band token>). Otherwise we say honestly it's saved on THIS device.
  function scheduled(){ if(body) body.innerHTML='<h3>🌹 Set List scheduled!</h3><div class="sub">'+n+' song'+(n===1?'':'s')+' — fans who opt in get each one texted the moment you play it. Reopen Set List anytime to edit.</div>'; }
  function localOnly(reason){ if(body) body.innerHTML='<h3>💾 Saved on this device</h3><div class="sub">'+n+' song'+(n===1?'':'s')+' saved here — it shows on your ticket now. To have us text it to fans live, '+(P('key')?('retry in a moment'+(reason?(' ('+esc(reason)+')'):'')+', or screenshot this to Michael'):'reopen this page from your band link (the one with your <b>key</b>)')+'.</div>'; }
  try{ var cl=window.ddClient&&ddClient(), key=P('key');
    if(cl&&cl.rpc&&key){ cl.rpc('dd_setlist_upsert_web',{p_band:slug,p_token:key,p_date:(B.set&&B.set.date)||null,p_start:slVal('slStart')||null,p_end:slVal('slEnd')||null,p_songs:out})   // → dd_setlists (token-gated)
      .then(function(r){ if(r&&r.error) localOnly((r.error&&(r.error.message||r.error.hint))||'server error'); else scheduled(); })
      .catch(function(){ localOnly('couldn’t reach the server'); });
      return; } }catch(e){}
  localOnly(P('key')?'couldn’t reach the server':'');
};

/* ---- StageFill buy spine (same contract as event_page.html) ---- */
function sfBuy(ttId){ fetch(SF_CHECKOUT,{method:'POST',headers:{'content-type':'application/json','Authorization':'Bearer '+SF_ANON},body:JSON.stringify({ticket_type_id:ttId,qty:1,ref:'band'})})
  .then(function(r){return r.json();}).then(function(d){ if(d&&d.url){ location.href=d.url; } else { alert('Checkout unavailable right now.'); } }).catch(function(){ alert('Checkout unavailable right now.'); }); }
function sfRSVP(ttId){ var cl=window.ddClient&&ddClient(); if(!(cl&&cl.rpc)){ alert('Offline — try again.'); return; }
  cl.rpc('sf_rsvp',{p_tt:ttId}).then(function(r){ var d=r&&r.data||{}; if(d.ok){ location.href=tixUrl()+'&t='+encodeURIComponent(d.token); } else { alert('Could not RSVP — please try again.'); } }).catch(function(){ alert('Could not RSVP right now.'); }); }
document.addEventListener('click',function(ev){ var b=ev.target&&ev.target.closest&&ev.target.closest('.sftix'); if(!b) return;
  if(b.getAttribute('data-sample')==='1'){ alert('Sample of the ticketed treatment — real Stripe checkout activates when the band turns on ticketing in their console.'); return; }
  var id=b.getAttribute('data-tt')||''; if(!/^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/.test(id)) return;
  if(b.getAttribute('data-free')==='1'){ sfRSVP(id); } else { sfBuy(id); } });

render();

/* hydrate the setlist from the backend (dd_setlists) so fans always see the band's latest — the
   SMS webhook and the app editor both write there. Best-effort; localStorage still wins if newer. */
try{ var _cl=window.ddClient&&ddClient(); if(_cl&&_cl.rpc){ _cl.rpc('dd_setlist_get',{p_band:slug,p_date:(B.set&&B.set.date)||null}).then(function(r){
  var d=r&&r.data; if(d&&d.songs&&d.songs.length){ B.setlist={win:{s:(d.win_start||'').slice(0,5),e:(d.win_end||'').slice(0,5)},songs:d.songs}; }
}).catch(function(){}); } }catch(e){}

/* PRE-SHOW ROUTINE: if this band's set is within the window and no setlist is entered yet, remind
   the band group (all members). On the band's own page (role=band) also show an inline banner. */
try{ if(window.DDSetlistReminder){
  var _rem=DDSetlistReminder.due(slug, B, {forceMember: slIsBand()?true:null});
  if(_rem){ if(slIsBand()){ DDSetlistReminder.fire(_rem); DDSetlistReminder.banner('slRemSlot', _rem); }
            else if(_rem.member===true){ DDSetlistReminder.fire(_rem); } }
} }catch(e){}

/* live ticketed event: ?ev=<slug> pulls a real StageFill event and gives it the same treatment */
(function(){ var ev=P('ev'); if(!ev) return; var cl=window.ddClient&&ddClient(); if(!(cl&&cl.rpc)) return;
  cl.rpc('sf_get',{p_slug:ev}).then(function(r){ if(r&&!r.error&&r.data&&r.data.event){ var d=r.data,e=d.event;
    B={ name:e.name, kind:(e.venue||'Ticketed Show'), home:[e.city,e.state].filter(Boolean).join(', '),
        members:(B&&B.members)||[], ticketed:true, host:(e.is_owner?'self':'managed'),
        set:{date:e.date_start,time:e.start_time,stage:e.venue},
        tickets:(d.ticket_types||[]).map(function(t){return {id:t.id,name:t.name,price_cents:t.price_cents};}),
        tease:[], recording:null, links:{}, coming:[], conf:'' };
    render(); } }).catch(function(){}); })();
</script>
