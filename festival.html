<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Festival · StageFill</title><meta name="theme-color" content="#241535">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--rose:#b8002e;--purple:#5a2e86;--ink:#1a1320;--muted:#7a7285;--line:#ece7f2;--gold:#f0a500}
*{box-sizing:border-box}body{margin:0;background:#faf8fc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 80px}
.hero{background:#fbf6e3;border:1px solid #ece0bd;border-radius:20px;padding:20px}
.hero .k{color:#7a6a2e;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-size:38px;line-height:.95;margin:4px 0 4px;font-weight:900;letter-spacing:-1px;text-transform:uppercase;color:#161616}
.hero p{margin:0;color:#514a38;font-size:13.5px}
.sec{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
#map{height:360px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.leaflet-attribution-flag{display:none!important}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:#4a4356;margin-top:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #f4f0fa}
.row:last-child{border-bottom:0}.row .nm{font-weight:700;font-size:14px}.row .dt{font-size:12px;color:var(--muted)}
.row a{color:var(--purple);font-weight:800;font-size:12.5px;text-decoration:none;white-space:nowrap}
.qrwrap{text-align:center;background:#fffdf6;border:1px solid #f0d9a6;border-radius:14px;padding:14px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
</style></head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="k" id="fCity">Loading…</div>
    <h1 id="fName">Festival</h1>
    <p id="fDates"></p>
  </div>

  <div id="rainbox"></div>

  <div class="sec">The map — everything, where it actually is</div>
  <div id="map"></div>
  <div class="legend" id="legend"></div>

  <div id="sections"></div>

  <div class="sec">Share this map · no app needed</div>
  <div class="qrwrap">
    <div id="fqr" style="width:180px;height:180px;margin:0 auto"></div>
    <div style="font-weight:900;font-size:15px;margin-top:8px">No app. No download.</div>
    <div style="font-size:12.5px;color:var(--muted)">On your phone? <b>Tap it.</b> Showing a friend? <b>They scan it.</b></div>
  </div>

  <div class="foot">Built with <b>StageFill</b> — the any-city festival companion. 🌹</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="qr.js"></script><script src="dd_qrmark.js"></script><script src="dd_map.js"></script>
<script src="dd_rainshine.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function qp(k){ return new URLSearchParams(location.search).get(k)||''; }
/* Built-in palette — mirrors the Festival Maker's TYPES. Custom types (cust_*) come from doc.customTypes. */
var BUILTIN={
  stage:{lb:'Stages',ic:'🎵',c:'#7c3aed'}, restroom:{lb:'Restrooms',ic:'🚻',c:'#2a7de1'}, access:{lb:'Wheelchair',ic:'♿',c:'#12854f'},
  misting:{lb:'Misting',ic:'💧',c:'#2a7de1'}, firstaid:{lb:'First Aid',ic:'✚',c:'#b8002e'}, police:{lb:'Security',ic:'👮',c:'#2a7de1'},
  merch:{lb:'Merch',ic:'🎁',c:'#d63384'}, show:{lb:'Shows',ic:'🎪',c:'#b8002e'}, rides:{lb:'Rides',ic:'🎡',c:'#e8730c'},
  gate:{lb:'Gates',ic:'🎟',c:'#3a1f57'}, coaster:{lb:'Thrill',ic:'🎢',c:'#e8730c'}, beer:{lb:'Beer',ic:'🍺',c:'#c79a3a'},
  drinks:{lb:'Drinks',ic:'🥤',c:'#e8730c'}, pizza:{lb:'Pizza',ic:'🍕',c:'#b8002e'}, burger:{lb:'Burgers',ic:'🍔',c:'#c79a3a'},
  food:{lb:'Food',ic:'🥗',c:'#12854f'}, hotdog:{lb:'Hot Dogs',ic:'🌭',c:'#e8730c'}, taco:{lb:'Mexican',ic:'🌮',c:'#e8730c'},
  icecream:{lb:'Ice Cream',ic:'🍦',c:'#2a7de1'}, popcorn:{lb:'Snacks',ic:'🍿',c:'#c79a3a'},
  atm:{lb:'ATM',ic:'🏧',c:'#e8730c'}, parking:{lb:'Parking',ic:'🅿️',c:'#1f5fbf'}, shuttle:{lb:'Shuttle',ic:'🚐',c:'#b8002e'}, bus:{lb:'Bus Stop',ic:'🚌',c:'#e8a300'}, recycle:{lb:'Recycling',ic:'♻️',c:'#2a8a4a'}
};
var ORDER=['stage','show','rides','coaster','gate','merch','beer','drinks','food','pizza','burger','hotdog','taco','icecream','popcorn','restroom','misting','access','firstaid','police','atm','parking','shuttle','bus','recycle'];
var SB; try{ SB=window.supabase.createClient("https://vmbqfzxhrqxpwgidogfm.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYnFmenhocnF4cHdnaWRvZ2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDUzODUsImV4cCI6MjA5Nzk4MTM4NX0.aa2guYvXJ7SLAEdYOpDKb6xzHP-ypMpZFPFSdwLc6xM"); }catch(e){}
function dir(ll){ return 'https://www.google.com/maps/dir/?api=1&destination='+ll[0]+','+ll[1]+'&travelmode=walking'; }
function centroid(cs){ if(!cs||!cs.length)return null; var la=0,ln=0; cs.forEach(function(p){la+=p[0];ln+=p[1];}); return [la/cs.length,ln/cs.length]; }
function typeInfo(k,customMap){ return BUILTIN[k] || customMap[k] || {lb:'Other',ic:'📍',c:'#7a8397'}; }

function render(F){
  var doc=F.doc||{};
  document.getElementById('fName').textContent=F.name||'Festival';
  document.getElementById('fCity').textContent=F.region||'';
  document.getElementById('fDates').textContent=F.dates||'';
  document.title=(F.name||'Festival')+' · StageFill';

  // custom types → lookup
  var customMap={}; (doc.customTypes||[]).forEach(function(t){ customMap[t.k]={lb:t.lb,ic:t.ic,c:t.c}; });

  // FANS SEE VERIFIED PINS ONLY (the place→verify→adjust gate). Flatten the object-of-arrays.
  var pins=[]; var items=doc.items||{};
  Object.keys(items).forEach(function(k){ (items[k]||[]).forEach(function(r){
    if(r.status!=='verified') return; if(r.lat==null||r.lng==null||r.lat===''||r.lng==='') return;
    pins.push({type:k, name:r.n||'', detail:r.d||'', ll:[+r.lat,+r.lng]});
  }); });
  pins=pins.slice(0,1500);   // render cap (DoS guard)

  var platzes=(doc.platzes||[]).slice(0,200), tents=(doc.tents||[]).slice(0,400);   // render caps (DoS guard)
  var platzName={}; platzes.forEach(function(p){ platzName[p.id]=p.name; });

  // map — CARTO tiles (load over file:// and https; OSM 403s no-referer). errorTileUrl → blank, never a "403" graphic.
  var BLANK_TILE='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
  var map=L.map('map',{zoomControl:true,maxZoom:21});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',attribution:'© OpenStreetMap © CARTO',maxZoom:20,errorTileUrl:BLANK_TILE}).addTo(map);
  // grounds boundary
  var bound=F.boundary||doc.footprint; if(bound&&bound.length>=3){ try{ L.polygon(bound,{color:'#5a2e86',weight:2,fillColor:'#5a2e86',fillOpacity:.05}).addTo(map); }catch(e){} }
  // Platz fills (below), then tents (covered=solid orange, uncovered=dashed)
  platzes.forEach(function(p){ if(p.corners&&p.corners.length>=3) try{ L.polygon(p.corners,{color:'#0e9488',weight:2,fillColor:'#14b8a6',fillOpacity:.08}).addTo(map).bindTooltip('▦ '+esc(p.name||'Platz'),{sticky:true}); }catch(e){} });
  tents.forEach(function(t){ if(!(t.corners&&t.corners.length>=3))return;
    var st=t.covered?{color:'#e8730c',weight:2,fillColor:'#f59e0b',fillOpacity:.22}:{color:'#e8730c',weight:2,dashArray:'6,5',fillColor:'#f59e0b',fillOpacity:.10};
    try{ L.polygon(t.corners,st).addTo(map).bindTooltip('⛺ '+esc(t.name||'Tent')+(t.covered?' · ☂ rain-or-shine':''),{sticky:true}); }catch(e){}
  });
  // the festival's OWN designed map sheet(s) — curtains UNDER the icons. Lukas Apps' geo + data still
  // runs it all; this just lets a festival recognize their familiar map. Toggle off to see the geo map.
  var mos=(doc.mapOverlays&&doc.mapOverlays.length)?doc.mapOverlays:(doc.mapOverlay?[doc.mapOverlay]:[]), ovLayers=[];
  if(mos.length){ try{ if(!map.getPane('fqImg')){ map.createPane('fqImg'); map.getPane('fqImg').style.zIndex=350; }
    mos.forEach(function(o){ if(o&&o.img&&o.bounds){ ovLayers.push(L.imageOverlay(o.img, o.bounds, {opacity:(o.opacity!=null?o.opacity:0.6), pane:'fqImg'}).addTo(map)); } }); }catch(e){} }
  // pins on top
  pins.forEach(function(p){ var t=typeInfo(p.type,customMap);
    L.marker(p.ll,{icon:L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,13],html:'<div style="width:26px;height:26px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);background:'+t.c+';border:2px solid #fff;box-shadow:0 2px 6px #0005;display:flex;align-items:center;justify-content:center"><span style="transform:rotate(-45deg);font-size:13px">'+t.ic+'</span></div>'}),title:p.name}).addTo(map)
     .bindPopup('<b>'+esc(p.name||t.lb)+'</b>'+(p.detail?('<br><span style="font-size:12px;color:#555">'+esc(p.detail)+'</span>'):'')+'<br><a href="'+dir(p.ll)+'" target="_blank" rel="noopener" style="font-weight:800;color:#5a2e86">🚶 Walk me there</a>');
  });
  var allLL=pins.map(function(p){return p.ll;}).concat(bound&&bound.length>=3?bound:[]);
  if(allLL.length){ try{ map.fitBounds(allLL,{padding:[36,36],maxZoom:18}); }catch(e){ map.setView(F.center||[40.6013,-75.4979],16); } }
  else map.setView(F.center||[40.6013,-75.4979],16);
  setTimeout(function(){ try{map.invalidateSize();}catch(e){} },250);

  // legend
  document.getElementById('legend').innerHTML=ORDER.concat(Object.keys(customMap)).filter(function(k){return pins.some(function(p){return p.type===k;});})
    .map(function(k){var t=typeInfo(k,customMap);return '<span>'+t.ic+' '+esc(t.lb)+'</span>';}).join('');
  if(ovLayers.length){ var lg=document.getElementById('legend');
    lg.insertAdjacentHTML('afterbegin','<button id="ovToggle" style="border:1px solid #e2c58a;background:#fff8ec;color:#7a4a12;font:800 12px system-ui;border-radius:999px;padding:5px 11px;cursor:pointer;margin-right:6px">🖼 Map guide: on</button>');
    document.getElementById('ovToggle').onclick=function(){ var on=map.hasLayer(ovLayers[0]);
      ovLayers.forEach(function(l){ if(on){ map.removeLayer(l); } else { l.addTo(map); } });
      this.textContent='🖼 Map guide: '+(on?'off':'on'); this.style.opacity=on?'.6':'1'; };
  }

  // sections grouped by type
  var host=document.getElementById('sections'), html='';
  ORDER.concat(Object.keys(customMap)).forEach(function(k){ var group=pins.filter(function(p){return p.type===k;}); if(!group.length)return; var t=typeInfo(k,customMap);
    html+='<div class="sec">'+t.ic+' '+esc(t.lb)+' ('+group.length+')</div><div class="card">'+
      group.map(function(p){ return '<div class="row"><div><div class="nm">'+esc(p.name||'')+'</div>'+(p.detail?('<div class="dt">'+esc(p.detail)+'</div>'):'')+'</div><a href="'+dir(p.ll)+'" target="_blank" rel="noopener">walk ›</a></div>'; }).join('')+'</div>';
  });
  if(!pins.length){ html='<div class="card" style="text-align:center;color:#7a7285">This map is being finalized — check back soon. 🌹</div>'; }
  host.innerHTML=html;

  // RAIN OR SHINE — surface covered tents; live weather at the grounds
  try{ if(window.DDRain){ DDRain.mount({ hostId:'rainbox', map:map, center:F.center||centroid(bound),
    tents: tents.map(function(t){ return {id:t.id,name:t.name,covered:!!t.covered,platz:platzName[t.platzId]||'',center:centroid(t.corners)}; }) }); } }catch(e){}

  // QR to this live page (dual-door: tap or scan)
  try{ if(window.DDQR) DDQR.into('fqr', location.href.split('#')[0], {mark:'dd',size:360,css:180,caption:true}); }catch(e){}
}

(function(){ var slug=qp('event')||qp('festival');
  if(!slug){ document.getElementById('fName').textContent='No festival'; document.getElementById('fCity').textContent='Add ?event=<slug> to the link'; return; }
  if(!SB){ document.getElementById('fCity').textContent='Offline'; return; }
  SB.rpc('dd_festival_get',{p_slug:slug,p_token:null}).then(function(r){
    if(r.error||!r.data){ document.getElementById('fName').textContent='Not found'; document.getElementById('fCity').textContent='This festival isn’t published yet.'; return; }
    var F=(typeof r.data==='string')?JSON.parse(r.data):r.data;
    if(!F.published && !(F.doc&&F.doc.items)){ document.getElementById('fName').textContent=F.name||'Coming soon'; document.getElementById('fCity').textContent='This festival isn’t published yet.'; return; }
    render(F);
  }).catch(function(){ document.getElementById('fCity').textContent='Could not load.'; });
})();
</script>
</body></html>
