<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Festival Host — Rolling Ad</title>
<style>
/* THE festival-host rolling ad — the most special card in the rotation, for EVERY festival.
   Front = the host's brand (their color); back = that festival's live-map QR. Flip plays twice
   per appearance; rotation weight 4× (data-ad-weight). Parameterize via query string or the
   Festival Maker draft:  ?host=&color=%233c3b34&fest=&year=&dates=&loc=&tagline=&map=&skyline=steelstacks|festival
   Defaults to ArtsQuest · MusikFest 2026. */
:root{--base:#3c3b34;--top:#4a4840;--bot:#2a2925;--gold:#e0b94a;--goldlt:#ecc95c;--cream:#f4efe4;--ink:#f4efe4}
html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:#1b1a16}
/* two QR reveals, each held STATIC ~5s so an external camera can lock on. Tap to freeze indefinitely. */
@keyframes hf_flip{0%,12%{transform:rotateY(0)}18%,42%{transform:rotateY(180deg)}48%,58%{transform:rotateY(360deg)}64%,88%{transform:rotateY(540deg)}94%,100%{transform:rotateY(720deg)}}
@keyframes hf_aur{0%{transform:translate(-6%,-4%) scale(1.1);opacity:.8}50%{transform:translate(6%,4%) scale(1.25);opacity:1}100%{transform:translate(-6%,-4%) scale(1.1);opacity:.8}}
@keyframes hf_aur2{0%{transform:translate(5%,3%) scale(1.2);opacity:.6}50%{transform:translate(-5%,-3%) scale(1.05);opacity:.9}100%{transform:translate(5%,3%) scale(1.2);opacity:.6}}
@keyframes hf_tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes hf_sweep{0%{left:-60%}60%,100%{left:130%}}
@keyframes hf_glow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.85;transform:scale(1.08)}}
@keyframes hf_pulse{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.hf-stage{perspective:1300px}
.hf-flip{position:relative;width:300px;height:520px;transform-style:preserve-3d;animation:hf_flip 20s ease-in-out infinite}
.hf-flip.hold{animation:none !important;transform:rotateY(180deg)}   /* tap-to-freeze on the QR to scan */
.hf-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:26px;overflow:hidden;
  box-shadow:0 24px 60px rgba(20,18,12,.55),inset 0 0 0 1px rgba(255,255,255,.05);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.hf-front{background:radial-gradient(120% 90% at 50% 0%,var(--top) 0%,var(--base) 46%,var(--bot) 100%);color:var(--ink);text-decoration:none;display:block}
.hf-back{transform:rotateY(180deg);background:radial-gradient(120% 90% at 50% 0%,var(--top) 0%,var(--base) 46%,var(--bot) 100%);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;text-decoration:none}
.hf-aur{position:absolute;border-radius:50%;filter:blur(36px);pointer-events:none}
.hf-a1{width:270px;height:270px;top:-50px;left:-40px;background:radial-gradient(circle,var(--gold),transparent 64%);opacity:.6;animation:hf_aur 15s ease-in-out infinite}
.hf-a2{width:240px;height:240px;top:70px;right:-60px;background:radial-gradient(circle,#c8794f88,transparent 62%);animation:hf_aur2 18s ease-in-out infinite}
.hf-star{position:absolute;width:2px;height:2px;border-radius:50%;background:#f7f0df;animation:hf_tw 3.6s ease-in-out infinite}
.hf-eyebrow{position:absolute;top:26px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.32em;color:var(--goldlt)}
.hf-brand{position:absolute;top:56px;left:0;right:0;text-align:center;padding:0 18px}
.hf-mark{display:inline-block;position:relative;font-weight:900;font-size:30px;color:var(--cream);line-height:1.05;overflow:hidden}
.hf-tag{margin-top:6px;font-size:10px;font-style:italic;letter-spacing:.14em;color:#d9cfb8}
.hf-sweep{position:absolute;top:0;bottom:0;width:44%;left:-60%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,248,225,.4),transparent);animation:hf_sweep 6.5s ease-in-out infinite}
.hf-host{position:absolute;top:186px;left:0;right:0;text-align:center;padding:0 16px}
.hf-host .k{font-size:10px;font-weight:800;letter-spacing:.3em;color:var(--goldlt)}
.hf-fest{font-weight:900;font-size:28px;margin-top:6px;color:var(--cream);text-shadow:0 2px 18px rgba(224,185,74,.3);line-height:1.05}
.hf-when{margin-top:8px;font-size:12.5px;font-weight:700;color:#eadfc7}
.hf-where{font-size:11px;font-weight:600;color:#b6ab93;margin-top:2px}
.hf-cta{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,var(--goldlt),var(--gold));color:#3c2f10;font-weight:900;font-size:13px;padding:11px 20px;border-radius:999px;white-space:nowrap;animation:hf_pulse 2.8s ease-in-out infinite}
.hf-foot{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:8.5px;font-weight:700;letter-spacing:.06em;color:#8f866f}
.hf-sky{position:absolute;left:0;right:0;bottom:0;height:190px}
.hf-uplight{position:absolute;left:50%;bottom:0;width:290px;height:155px;transform:translateX(-50%);background:radial-gradient(60% 100% at 50% 100%,rgba(224,185,74,.46),transparent 70%);animation:hf_glow 6s ease-in-out infinite}
.hf-back .bk{font-size:10.5px;font-weight:800;letter-spacing:.28em;color:var(--goldlt)}
.hf-back .bmark{font-weight:900;font-size:20px;color:var(--cream);margin-top:4px;padding:0 14px}
.hf-qp{width:208px;height:208px;background:#fbf7ec;border-radius:18px;margin:18px 0 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(0,0,0,.4);overflow:hidden}
.hf-qp #hfQR{width:180px;height:180px;display:flex;align-items:center;justify-content:center}
.hf-back h3{margin:0;font-size:17px;font-weight:900;color:var(--cream)}
.hf-back p{margin:5px 0 0;font-size:12px;color:#c7bda5;font-weight:600}
.hf-back .cta2{margin-top:16px;background:linear-gradient(180deg,var(--goldlt),var(--gold));color:#3c2f10;font-weight:900;font-size:12.5px;padding:9px 18px;border-radius:999px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="hf-stage">
<div class="hf-flip" id="flip" data-ad-weight="4" data-ad="festival-host">
  <a class="hf-face hf-front" id="front" href="#">
    <span class="hf-aur hf-a1"></span><span class="hf-aur hf-a2"></span>
    <span class="hf-star" style="top:40px;left:40px"></span><span class="hf-star" style="top:70px;left:230px;animation-delay:1.1s"></span>
    <span class="hf-star" style="top:120px;left:60px;animation-delay:2s;width:3px;height:3px"></span><span class="hf-star" style="top:150px;left:250px;animation-delay:.7s"></span>
    <div class="hf-eyebrow">◆ PROUD HOST ◆</div>
    <div class="hf-brand"><span class="hf-mark" id="mark">HOST<span class="hf-sweep"></span></span><div class="hf-tag" id="tag">imagine that</div></div>
    <div class="hf-host"><div class="k">— PRESENTS —</div><div class="hf-fest" id="fest">FESTIVAL</div><div class="hf-when" id="when"></div><div class="hf-where" id="where"></div></div>
    <div id="sky"></div>
    <span class="hf-uplight"></span>
    <span class="hf-cta" id="cta">🎟️ Get your pass →</span>
    <div class="hf-foot">POWERED BY ✦ STAGEFILL · flip for the map ⤾</div>
  </a>
  <div class="hf-face hf-back" id="back">
    <div class="bk">◆ FESTIVAL MAP ◆</div>
    <div class="bmark" id="bmark">HOST</div>
    <div class="hf-qp"><div id="hfQR">▦</div></div>
    <h3>Scan for the live map</h3>
    <p>Every stage, potty, first aid &amp; act on now</p>
    <div class="cta2" id="qurl">deaddance.app</div>
    <div id="holdhint" style="font-size:10px;color:#a89f8c;font-weight:700;margin-top:9px">🔒 Tap to hold still, then scan</div>
  </div>
</div>
</div>
<script src="qr.js"></script>
<script>
function P(k){ return new URLSearchParams(location.search).get(k); }
function hx(h){ h=(h||'').replace('#',''); if(h.length===3)h=h.split('').map(function(c){return c+c;}).join(''); return [parseInt(h.slice(0,2),16)||60,parseInt(h.slice(2,4),16)||59,parseInt(h.slice(4,6),16)||52]; }
function toh(a){ return '#'+a.map(function(x){return Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0');}).join(''); }
function lighten(hex,a){ return toh(hx(hex).map(function(x){return x+(255-x)*a;})); }
function darken(hex,a){ return toh(hx(hex).map(function(x){return x*(1-a);})); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

/* pull from the Festival Maker draft if present, else query params, else ArtsQuest defaults */
var draft=null; try{ draft=JSON.parse(localStorage.getItem('dd.eventmaker.draft')||'null'); }catch(e){}
function fmtDates(a,b){ if(!a)return 'July 31 – August 9'; function d(x){return new Date(x+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric'});}
  return b&&b!==a ? d(a)+' – '+new Date(b+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric'}) : d(a); }

var host   = P('host')   || (draft&&draft.venue) || 'ArtsQuest';
var color  = P('color')  || '#3c3b34';
var fest   = P('fest')   || (draft&&draft.name) || 'MusikFest 2026';
var dates  = P('dates')  || (draft ? fmtDates(draft.dateStart, draft.dateEnd) : 'July 31 – August 9');
var loc    = P('loc')    || (draft ? [draft.city,draft.state].filter(Boolean).join(', ') : 'Bethlehem, PA · SteelStacks');
var tag    = P('tagline')|| (host==='ArtsQuest'?'imagine that ™':'');
var mapurl = P('map')    || (draft&&draft.slug ? (location.origin+'/event_page.html?ev='+encodeURIComponent(draft.slug)) : (location.origin.indexOf('http')===0?location.origin:'https://deaddance.app')+'/artsquest_musikfest.html');
var skyline= P('skyline')|| (host==='ArtsQuest'?'steelstacks':'festival');

/* brand color → gradient */
var r=document.documentElement.style;
r.setProperty('--base',color); r.setProperty('--top',lighten(color,.14)); r.setProperty('--bot',darken(color,.30));

/* wordmark — ArtsQuest gets its bracket styling; others get a clean cap wordmark */
function markHTML(){ if(host.toLowerCase()==='artsquest'){ return '<span style="color:var(--gold)">[</span>ARTS<span style="color:var(--gold)">]</span>QUEST'; } return esc(host.toUpperCase()); }
document.getElementById('mark').innerHTML=markHTML()+'<span class="hf-sweep"></span>';
document.getElementById('bmark').innerHTML=markHTML();
document.getElementById('tag').textContent=tag; if(!tag)document.getElementById('tag').style.display='none';
/* festival title with a gold accent on the second half if two words */
var fParts=String(fest).split(' '); var festHTML = fParts.length>1 ? esc(fParts[0])+' <b style="color:var(--gold)">'+esc(fParts.slice(1).join(' '))+'</b>' : esc(fest);
document.getElementById('fest').innerHTML=festHTML.toUpperCase().replace('<B ','<b ').replace('</B>','</b>');
document.getElementById('fest').innerHTML=fParts.length>1 ? esc(fParts[0]).toUpperCase()+' <b style="color:var(--gold)">'+esc(fParts.slice(1).join(' ')).toUpperCase()+'</b>' : esc(fest).toUpperCase();
document.getElementById('when').textContent=dates;
document.getElementById('where').textContent=loc;
document.getElementById('front').href=mapurl;
/* tap the QR side to FREEZE it (stops the flip) so an external camera can scan; tap again to resume */
var flip=document.getElementById('flip'), hint=document.getElementById('holdhint');
document.getElementById('back').addEventListener('click',function(e){ e.preventDefault();
  var held=flip.classList.toggle('hold'); if(hint) hint.textContent = held ? '⏸ Held — scan now (tap to resume)' : '🔒 Tap to hold still, then scan'; });
var short=String(mapurl).replace(/^https?:\/\//,'').replace(/^www\./,''); document.getElementById('qurl').textContent=short.length>30?short.slice(0,30)+'…':short;

/* skyline */
var STEEL='<svg class="hf-sky" viewBox="0 0 300 190" preserveAspectRatio="xMidYMax meet"><g fill="'+darken(color,.6)+'">'
 +'<rect x="18" y="70" width="26" height="120"/><rect x="14" y="60" width="6" height="130"/><rect x="42" y="54" width="6" height="136"/>'
 +'<rect x="58" y="52" width="30" height="138"/><rect x="54" y="40" width="6" height="150"/><rect x="86" y="44" width="6" height="146"/>'
 +'<rect x="104" y="40" width="32" height="150"/><rect x="100" y="26" width="6" height="164"/><rect x="134" y="30" width="6" height="160"/>'
 +'<rect x="154" y="58" width="28" height="132"/><rect x="150" y="46" width="6" height="144"/><rect x="180" y="50" width="6" height="140"/>'
 +'<rect x="200" y="66" width="26" height="124"/><rect x="196" y="56" width="6" height="134"/><rect x="224" y="60" width="6" height="130"/>'
 +'<rect x="244" y="78" width="30" height="112"/><rect x="0" y="150" width="300" height="40"/></g>'
 +'<g fill="#f2a900" opacity=".95"><circle cx="120" cy="28" r="1.6"/><circle cx="72" cy="42" r="1.4"/><circle cx="168" cy="48" r="1.4"/></g></svg>';
var FEST='<svg class="hf-sky" viewBox="0 0 300 190" preserveAspectRatio="xMidYMax meet"><g fill="'+darken(color,.6)+'">'
 /* stage with truss */
 +'<rect x="86" y="96" width="128" height="94"/><rect x="82" y="86" width="136" height="12"/><rect x="90" y="74" width="6" height="18"/><rect x="204" y="74" width="6" height="18"/><rect x="90" y="74" width="120" height="6"/>'
 /* speaker stacks */
 +'<rect x="70" y="120" width="14" height="70"/><rect x="216" y="120" width="14" height="70"/>'
 /* tents */
 +'<path d="M6 190 L34 150 L62 190 Z"/><path d="M238 190 L266 154 L294 190 Z"/>'
 /* ferris wheel */
 +'<circle cx="256" cy="118" r="30" fill="none" stroke="'+darken(color,.6)+'" stroke-width="3"/><rect x="254" y="146" width="4" height="44"/>'
 +'<rect x="0" y="160" width="300" height="30"/></g>'
 +'<g stroke="#f2a900" stroke-width="1.4" opacity=".8"><line x1="256" y1="118" x2="256" y2="88"/><line x1="256" y1="118" x2="282" y2="132"/><line x1="256" y1="118" x2="230" y2="132"/><line x1="256" y1="118" x2="256" y2="148"/></g>'
 +'<g fill="#f2a900" opacity=".9"><circle cx="150" cy="70" r="1.6"/><circle cx="34" cy="150" r="1.3"/><circle cx="266" cy="154" r="1.3"/></g></svg>';
document.getElementById('sky').innerHTML = (skyline==='steelstacks'?STEEL:FEST);

/* real scannable QR of the festival map */
try{ if(window.DDQR&&DDQR.into){ DDQR.into('hfQR', mapurl, {size:180, css:40, caption:false}); } else { document.getElementById('hfQR').textContent='QR'; } }catch(e){ document.getElementById('hfQR').textContent='QR'; }
</script>
</body>
</html>
