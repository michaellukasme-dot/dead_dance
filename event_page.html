<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Event · StageFill</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--ink:#1f2430;--muted:#8a92a6;--line:#e4e7ee;--bg:#f5f6f8;--accent:#2f6feb;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:hidden}
body{font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.top{position:relative}
#emMap{height:44vh;min-height:280px;z-index:1}
.backbtn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:5;background:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;box-shadow:0 2px 8px #0003;cursor:pointer;color:var(--accent);text-decoration:none}
.wrap{max-width:760px;margin:-26px auto 0;position:relative;z-index:3;padding:0 14px 70px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px #0001;padding:16px;display:flex;gap:14px;align-items:flex-start}
#qr{width:64px;height:64px;background:#fff;border:1px solid var(--line);border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hgrow{flex:1;min-width:0}
.cat{display:inline-block;background:#eef2fb;color:var(--accent);font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px}
h1{margin:8px 0 4px;font-size:clamp(20px,5vw,28px);letter-spacing:-.01em}
.when{font-weight:800;color:var(--ink);font-size:14px}
.where{color:var(--muted);font-weight:600;font-size:13px;margin-top:2px}
.share{margin-top:10px;display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:0;border-radius:10px;font-weight:800;font-size:13px;padding:9px 14px;cursor:pointer}
h2{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.act{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:8px}
.act .t{width:60px;font-weight:800;color:var(--accent);font-size:12px}
.act .n{flex:1;font-weight:800;font-size:14px}
.act .g{font-size:11.5px;color:var(--muted);font-weight:700}
.empty{color:var(--muted);font-size:13px}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.foot a{color:var(--accent);text-decoration:none;font-weight:700}
.miss{max-width:520px;margin:60px auto;text-align:center;padding:0 20px}
.actpin{background:var(--accent);color:#fff;border-radius:50% 50% 50% 0;width:24px;height:24px;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0005;border:2px solid #fff}
.actpin span{transform:rotate(45deg);font-size:12px}
</style>
</head>
<body>
<div id="page"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>try{ var _SFC=window.supabase.createClient("https://vmbqfzxhrqxpwgidogfm.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYnFmenhocnF4cHdnaWRvZ2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDUzODUsImV4cCI6MjA5Nzk4MTM4NX0.aa2guYvXJ7SLAEdYOpDKb6xzHP-ypMpZFPFSdwLc6xM"); window.ddClient=function(){return _SFC;}; try{ _SFC.auth.getSession().then(function(r){ if(!(r&&r.data&&r.data.session)) _SFC.auth.signInAnonymously(); }); }catch(_e){} }catch(e){}</script>

<script src="qr.js"></script>
<script src="dd_categories.js"></script>
<script src="stagefill_events.js"></script>
<script src="sf_fill.js"></script>
<script>
var SF_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYnFmenhocnF4cHdnaWRvZ2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDUzODUsImV4cCI6MjA5Nzk4MTM4NX0.aa2guYvXJ7SLAEdYOpDKb6xzHP-ypMpZFPFSdwLc6xM", SF_CHECKOUT="https://vmbqfzxhrqxpwgidogfm.supabase.co/functions/v1/sf-checkout";
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function qs(k){ return new URLSearchParams(location.search).get(k); }
function catLabel(k){ try{ return window.DDCats?DDCats.labelFor(k):k; }catch(e){ return k; } }
function catIcon(k){ try{ var l=(window.DDCats?DDCats.list():[]).filter(function(c){return c.key===k;})[0]; return l?l.icon:'📍'; }catch(e){ return '📍'; } }
function fmtDate(s){ if(!s)return ''; return new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtRange(a,b){ if(!a)return ''; if(!b||b===a)return fmtDate(a);
  var da=new Date(a+'T12:00:00'), db=new Date(b+'T12:00:00');
  if(da.getMonth()===db.getMonth()&&da.getFullYear()===db.getFullYear()) return da.toLocaleDateString('en-US',{month:'short',day:'numeric'})+'–'+db.getDate()+', '+db.getFullYear();
  return fmtDate(a)+' – '+fmtDate(b); }
function fmtTime(t){ if(!t)return ''; var p=t.split(':'),h=+p[0],m=p[1]; var ap=h<12?'AM':'PM',h12=((h+11)%12)+1; return h12+':'+m+' '+ap; }

/* resolve the event: ?d=<encoded maker payload>, or ?ev=<slug> from the seed / local drafts */
function decode(d){ try{ return JSON.parse(decodeURIComponent(escape(atob(d)))); }catch(e){ return null; } }
function findEvent(){
  var d=qs('d'); if(d){ var o=decode(d); if(o) return o; }
  var ev=qs('ev'); if(ev){
    var seed=(window.STAGEFILL_EVENTS||[]).filter(function(e){return e.slug===ev;})[0]; if(seed) return seed;
    try{ var mine=JSON.parse(localStorage.getItem('dd.sf.myevents')||'[]'); var m=mine.filter(function(e){return e.slug===ev;})[0]; if(m) return m; }catch(e){}
  }
  return null;
}

var E=findEvent();
if(!E){ document.getElementById('page').innerHTML='<div class="miss"><h1>Event not found</h1><p class="empty">This link doesn’t point to a StageFill event yet.</p><p><a href="stagefill_events.html" style="color:#2f6feb;font-weight:800">← Browse all StageFill events</a></p></div>'; }
else { render(E); }

function render(E){
  var acts=E.acts||[];
  var page='<div class="top"><a class="backbtn" href="stagefill_events.html">‹ Events</a><div id="emMap"></div></div>'
   +'<div class="wrap"><div class="hero">'
   +'<div id="qr" title="Scan / share">▦</div>'
   +'<div class="hgrow"><span class="cat">'+catIcon(E.cat)+' '+esc(catLabel(E.cat))+'</span>'
   +'<h1>'+esc(E.name||'Untitled event')+'</h1>'
   +'<div class="when">'+esc(fmtRange(E.start||E.dateStart,E.end||E.dateEnd))+(E.time?(' · '+fmtTime(E.time||E.startTime)):'')+'</div>'
   +'<div class="where">'+[esc(E.venue||''),esc([E.city,E.state].filter(Boolean).join(', '))].filter(Boolean).join(' · ')+'</div>'
   +'<button class="share" onclick="shareEvent()">Share this event</button></div></div>'
   +'<h2>'+(acts.length?('Acts &amp; stages · '+acts.length):'Acts &amp; stages')+'</h2>'
   +'<div id="acts">'+(acts.length?acts.map(function(a){ var t=(a.time||'').replace(':00',''); var meta=[(a.catLabel?((a.catIcon||'')+' '+a.catLabel):''),(a.stage||'')].filter(Boolean).join(' · ');
       return '<div class="act"><span class="t">'+esc(t)+'</span><span class="n">'+esc(a.name)+(meta?'<span class="g"> · '+esc(meta)+'</span>':'')+'</span></div>'; }).join('')
       :'<div class="empty">Lineup to be announced.</div>')+'</div>'
   +(function(){ var tt=E.ticket_types||[]; if(!tt.length)return ''; return '<h2>Tickets</h2>'+tt.map(function(t){ var pr=(t.price_cents||0); var lbl=pr>0?('Buy '+esc(t.name)+' — $'+(pr/100).toFixed(0)):('Free — '+esc(t.name)); return '<button class="share sftix" data-tt="'+esc(String(t.id||''))+'" data-free="'+(pr>0?'0':'1')+'" style="width:100%;justify-content:center;margin-bottom:8px">'+lbl+'</button>'; }).join(''); })()
   +((E.ticket_types&&E.ticket_types.length)?'<div style="font-size:11px;color:var(--muted);margin:0 0 8px">By reserving or buying you agree to our <a href="terms.html" style="color:var(--accent)">Terms</a>, <a href="privacy_policy.html" style="color:var(--accent)">Privacy</a> &amp; <a href="refunds.html" style="color:var(--accent)">Refunds</a>.</div>':'')
   +(E._isOwner?'<button class="share" style="width:100%;justify-content:center;margin-top:6px;background:#12a150" onclick="sfOccView()">📊 Live occupancy (owner)</button>':'')
   +'<div class="foot">Powered by <b>StageFill</b> · the event map that works on phone, tablet &amp; computer — no app store, no signal needed. <a href="stagefill_events.html">Browse all events →</a></div></div>';
  $('page').innerHTML=page;
  var _ex=document.getElementById('sampleBanner'); if(_ex)_ex.remove();
  if(E.sample && !E._id){ var sb=document.createElement('div'); sb.id='sampleBanner'; sb.textContent='⚠︎ Sample / demo event — not a real booking'; sb.style.cssText='background:#fff3d6;color:#8a6d00;font-weight:800;font-size:12.5px;text-align:center;padding:8px 12px'; document.body.insertBefore(sb, document.body.firstChild); }

  /* map */
  var corners=E.corners, center=[E.lat||40.6187, E.lng||-75.3803];
  var map=L.map('emMap',{zoomControl:true,attributionControl:false}).setView(center,15);
  L.tileLayer('https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',{maxZoom:19,crossOrigin:true}).addTo(map);
  if(corners&&corners.tl){ var poly=L.polygon([corners.tl,corners.tr,corners.br,corners.bl],{color:'#2f6feb',weight:2,fillColor:'#7aa5f2',fillOpacity:.16}).addTo(map); try{ map.fitBounds(poly.getBounds().pad(0.2)); }catch(e){} }
  acts.forEach(function(a){ if(a.lat==null)return; var ic=L.divIcon({className:'',html:'<div class="actpin"><span>'+((a.catIcon)||'📍')+'</span></div>',iconSize:[24,24],iconAnchor:[12,24]});
    L.marker([a.lat,a.lng],{icon:ic,title:a.name}).addTo(map).bindPopup('<b>'+esc(a.name)+'</b><br>'+esc(a.stage||'')+' '+esc(a.time||'')); });
  setTimeout(function(){ map.invalidateSize(); },250);

  /* QR of this very page */
  try{ if(window.DDQR&&DDQR.into){ DDQR.into('qr',location.href,{size:300,css:60,caption:false}); } }catch(e){}
}

(function(){ var ev=qs('ev'); if(!ev)return; var cl=window.ddClient&&ddClient(); if(!(cl&&cl.rpc))return;
  cl.rpc('sf_get',{p_slug:ev}).then(function(r){ if(r&&!r.error&&r.data&&r.data.event){ var d=r.data,e=d.event;
    E={name:e.name,cat:e.cat,start:e.date_start,end:e.date_end,time:e.start_time,city:e.city,state:e.state,venue:e.venue,lat:e.lat,lng:e.lng,corners:e.corners,
       acts:(d.acts||[]).map(function(a){return {name:a.name,stage:a.stage,time:a.time,cat:a.cat,catIcon:'',lat:a.lat,lng:a.lng};}),ticket_types:(d.ticket_types||[]),_id:e.id,_isOwner:e.is_owner,_geofences:(d.geofences||[])};
    render(E); try{ sfPingStart(e.id,d.geofences); }catch(_e){}
    try{ if(e.is_owner && window.SFFill){ SFFill.mount({slug:ev, side:(qs('ref')==='band'?'band':'venue'), isOwner:true}); } }catch(_e){} } }).catch(function(){}); })();
function sfRSVP(ttId){ var cl=window.ddClient&&ddClient(); if(!(cl&&cl.rpc)){ alert('Offline — try again.'); return; }
  cl.rpc('sf_rsvp',{p_tt:ttId}).then(function(r){ var d=r&&r.data||{};
    if(d.ok){ location.href='sf_ticket.html?t='+encodeURIComponent(d.token); }
    else if(d.error==='full'){ alert('Sorry — the free allocation is full.'); }
    else if(d.error==='not_free'){ alert('That ticket needs checkout.'); }
    else if(d.error==='ticket_unavailable'){ alert('That ticket is no longer available.'); }
    else { alert('Could not RSVP — please try again.'); }
  }).catch(function(){ alert('Could not RSVP right now.'); }); }
/* delegated ticket handler — no user data in inline JS; id is validated as a UUID before it reaches sfBuy (no reflected XSS via ?d). */
document.addEventListener('click',function(ev){ var b=ev.target&&ev.target.closest&&ev.target.closest('.sftix'); if(!b)return;
  var id=b.getAttribute('data-tt')||''; if(!/^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/.test(id)) return;
  if(b.getAttribute('data-free')==='1'){ sfRSVP(id); } else { sfBuy(id); } });
/* ===== occupancy telemetry: privacy-safe geofence ping loop (device = rotating daily hash, never identity) ===== */
function sfDev(){ try{ var day=new Date().toISOString().slice(0,10), k='dd.pingdev', o=JSON.parse(localStorage.getItem(k)||'null'); if(!o||o.day!==day){ o={day:day,id:(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('d'+Math.random().toString(36).slice(2))}; localStorage.setItem(k,JSON.stringify(o)); } return o.id; }catch(e){ return 'anon'; } }
function _sfDist(a,b,c,d){ var R=6371000,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,s=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)*Math.sin(y/2); return 2*R*Math.asin(Math.sqrt(s)); }
var _pBuf=[], _pEvt=null, _pGf=[], _pAnchor=null, _pSince=0, _pIn=null;
function sfPingStart(eid, geofences){ if(_pEvt||!eid||!geofences||!geofences.length||!navigator.geolocation) return; _pEvt=eid; _pGf=geofences;
  navigator.geolocation.watchPosition(function(pos){ var la=pos.coords.latitude, ln=pos.coords.longitude, best=null, bd=1e9;
    _pGf.forEach(function(g){ if(g.lat==null)return; var dd=_sfDist(la,ln,g.lat,g.lng); if(dd<=(g.radius_m||25) && dd<bd){ bd=dd; best=g; } });
    if(best){ if(_pAnchor!==best.id){ _pAnchor=best.id; _pSince=Date.now(); } _pBuf.push({device:sfDev(), geofence_id:best.id, lat:la, lng:ln, dwell_s:Math.round((Date.now()-_pSince)/1000)}); }
    else { _pAnchor=null; }
  }, function(){}, {enableHighAccuracy:true, maximumAge:15000});
  _pIn=setInterval(sfPingFlush, 120000); window.addEventListener('pagehide', sfPingFlush); }   // 120s flush (was 60s) — halves occupancy write load at festival scale
function sfPingFlush(){ if(!_pEvt||!_pBuf.length) return; var batch=_pBuf.splice(0,300), cl=window.ddClient&&ddClient(); if(cl&&cl.rpc) cl.rpc('sf_ping_batch',{p_event:_pEvt, p_pings:batch}).catch(function(){}); }
function sfOccView(){ if(!E._id) return; var cl=window.ddClient&&ddClient(); if(!(cl&&cl.rpc)){ alert('Offline.'); return; } var day=new Date().toISOString().slice(0,10), slug=qs('ev')||'';
  cl.rpc('sf_rollup_mine',{p_slug:slug}).then(function(){ return cl.rpc('sf_occupancy_get',{p_event:E._id, p_day:day}); }).then(function(r){ sfOccRender((r&&r.data)||[]); }).catch(function(){ alert('Could not load occupancy.'); }); }
function sfOccRender(rows){ var hr=new Date().getHours(), byG={};
  rows.forEach(function(o){ if(!byG[o.label]) byG[o.label]={label:o.label,kind:o.kind,dev:0,uses:0}; if(o.hour===hr){ byG[o.label].dev+=o.devices; byG[o.label].uses+=o.uses; } });
  var list=Object.keys(byG).map(function(k){return byG[k];}).sort(function(a,b){return b.dev-a.dev;});
  var wrap=document.createElement('div'); wrap.style.cssText='position:fixed;inset:0;z-index:600;background:rgba(15,12,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto';
  wrap.onclick=function(ev){ if(ev.target===wrap) wrap.remove(); };
  wrap.innerHTML='<div style="background:#fff;border-radius:16px;max-width:520px;width:100%;box-shadow:0 20px 60px #0008;padding:16px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font-size:16px">📊 Live occupancy</b><button id="_occx" style="border:0;background:#eef1f6;width:30px;height:30px;border-radius:9px;cursor:pointer">✕</button></div>'
    +'<div style="font-size:12px;color:#8a92a6;margin-bottom:8px">Devices inside each geofence this hour — counts are devices, never identities.</div>'
    +(list.length?list.map(function(o){ return '<div style="display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #eef1f6"><span style="font-weight:700">'+esc(o.label||o.kind)+'</span><span style="font-weight:900;color:#2f6feb">'+o.dev+(o.uses?(' · '+o.uses+' uses'):'')+'</span></div>'; }).join(''):'<div style="color:#8a92a6;padding:12px 2px">No sessions yet — once fans open the map on-site, this fills in.</div>')
    +'</div>';
  document.body.appendChild(wrap); wrap.querySelector('#_occx').onclick=function(){ wrap.remove(); }; }
function sfBuy(ttId){ if(!ttId){return;} var ref=qs('ref')||''; ref=(['band','venue','door'].indexOf(ref)>=0)?ref:''; fetch(SF_CHECKOUT,{method:'POST',headers:{'content-type':'application/json','Authorization':'Bearer '+SF_ANON},body:JSON.stringify({ticket_type_id:ttId,qty:1,ref:ref})}).then(function(r){return r.json();}).then(function(d){
    if(d&&d.url){ location.href=d.url; return; }
    var e=(d&&d.error)||'';
    if(e==='sold_out'){ alert(d.available>0?('Only '+d.available+' left — try a smaller quantity.'):'Sorry — this ticket is sold out.'); }
    else if(e==='ticket_unavailable'){ alert('That ticket is no longer on sale.'); }
    else { alert('Checkout unavailable — please try again.'); }
  }).catch(function(){ alert('Checkout unavailable right now.'); }); }
(function(){ if(qs('paid')==='1'){ var b=document.createElement('div'); b.textContent='✅ Ticket confirmed — see you there!'; b.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:900;background:#12a150;color:#fff;font-weight:800;padding:10px 16px;border-radius:12px;box-shadow:0 6px 20px #0005'; document.body.appendChild(b); setTimeout(function(){b.remove();},5000); } })();
function shareEvent(){ var url=location.href; if(navigator.share){ navigator.share({title:(E.name||'Event')+' — StageFill',url:url}).catch(function(){}); }
  else { try{ navigator.clipboard.writeText(url); alert('Link copied.'); }catch(e){ prompt('Copy link:',url); } } }
</script>
<script src="dd_legal_footer.js"></script>
</body>
</html>
