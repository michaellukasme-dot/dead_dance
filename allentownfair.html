  .afhead h1{ margin:0; font-size:18px; font-weight:900; letter-spacing:-.01em; }

  #amap{ height:52vh; width:100%; background:#e9e3f2; }

  .lp a{ display:inline-block; margin-top:5px; background:#5a2e86; color:#fff; text-decoration:none; border-radius:8px; padding:5px 10px; font-weight:800; font-size:12px; }

var GORDER=['see','stage','gate','atm','wc','acc','bev','firstaid','police','info'];
var MAP, MK=[];
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function dirLink(ll){ return 'https://www.google.com/maps/dir/?api=1&destination='+ll[0]+','+ll[1]+'&travelmode=walking'; }

(function(){
  try{
    window.DD_MAP_PLAIN=true;   // plain street tiles — no purple DeadDance skin, no brand/Map toggle
    MAP=L.map('amap',{zoomControl:true,scrollWheelZoom:true});
    if(window.DDtile){ DDtile(MAP); } else { L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:20}).addTo(MAP); }
    L.polygon(BOUND,{color:'#7a3cc0',weight:2,fillColor:'#7a3cc0',fillOpacity:.07}).addTo(MAP);
    var layers={}; GORDER.forEach(function(k){ layers[k]=L.layerGroup().addTo(MAP); });
    PINS.forEach(function(p,i){
      var col=CATS[p.c].c, html = p.L ? '<div class="pinL" style="background:'+col+'">'+esc(p.L)+'</div>' : '<div class="pinE" style="color:'+col+'">'+p.ic+'</div>';
      var m=L.marker(p.ll,{icon:L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,13],html:html}),title:p.n}).addTo(layers[p.c])
        .bindPopup('<div class="lp"><b>'+(p.L?(esc(p.L)+' · '):'')+esc(p.n)+'</b><div class="g">'+CATS[p.c].lbl.replace(/^..\s/,'')+'</div><a href="'+dirLink(p.ll)+'" target="_blank" rel="noopener">🚶 Walk here</a></div>');
      MK[i]=m;
    });
    MAP.fitBounds(L.latLngBounds(BOUND.concat(PINS.map(function(p){return p.ll;}))).pad(0.06));
    // filter chips
    var leg=document.getElementById('aflegend'), on={}; GORDER.forEach(function(k){ on[k]=1;
      var b=document.createElement('button'); b.className='afchip'; b.textContent=CATS[k].lbl;
      b.onclick=function(){ on[k]=!on[k]; b.classList.toggle('off',!on[k]); if(on[k])layers[k].addTo(MAP); else MAP.removeLayer(layers[k]); };
      leg.appendChild(b);
    });
    // synced directory list
    var dir=document.getElementById('afdir'), html='';
    GORDER.forEach(function(k){
      var rows=''; PINS.forEach(function(p,i){ if(p.c!==k) return;
        var badge = p.L ? '<div class="afbadge" style="background:'+CATS[k].c+'">'+esc(p.L)+'</div>' : '<div class="afbadge e" style="color:'+CATS[k].c+'">'+p.ic+'</div>';
        rows += '<div class="afitem" data-n="'+esc(p.n.toLowerCase())+'" onclick="afGo('+i+')">'+badge+'<div class="nm">'+esc(p.n)+'</div>'
             +  '<a class="walk" href="'+dirLink(p.ll)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">Walk</a></div>';
      });
      html += '<div class="afgrp">'+CATS[k].lbl+'</div>'+rows;

window.afGo=function(i){ try{ MAP.setView(PINS[i].ll, 18, {animate:true}); MK[i].openPopup(); document.querySelector('.afmapwrap').scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){} };
window.afFilter=function(q){ q=(q||'').toLowerCase().trim();

(function(){ var tabs=document.getElementById('aftabs'), body=document.getElementById('afsched'); if(!tabs||!body) return;
  var gk=-1; PINS.forEach(function(p,i){ if(p.L==='K')gk=i; });
  function t2m(t){ var m=/(\d+):(\d+)\s*(AM|PM)/i.exec(t)||[]; var h=(+m[1]||0)%12; if(/pm/i.test(m[3]||''))h+=12; return h*60+(+m[2]||0); }
  function render(i){ var d=DAYS[i];
    [].forEach.call(tabs.children,function(b,j){ b.classList.toggle('off',j!==i); });
    var gs=(d.shows||[]).map(function(s){ return '<div class="afitem"'+(gk>=0?' onclick="afGo('+gk+')"':'')+'><div class="afbadge" style="background:#b8002e">★</div><div class="nm">'+esc(s.n)+'<div style="font-size:12px;color:#7a7285;font-weight:600">'+esc(s.t)+' · Grandstand</div></div><a class="walk" href="https://www.allentownfair.com/" target="_blank" rel="noopener" onclick="event.stopPropagation()">Tickets</a></div>'; }).join('');
    var rec=RECUR.slice().sort(function(a,b){return t2m(a.t)-t2m(b.t);}).map(function(s){ return '<div class="afitem"><div class="afbadge e" style="color:#5a2e86">🎪</div><div class="nm">'+esc(s.n)+'<div style="font-size:12px;color:#7a7285;font-weight:600">'+esc(s.t)+' · '+esc(s.st)+'</div></div></div>'; }).join('');
    body.innerHTML='<div style="font-size:11px;font-weight:800;letter-spacing:.06em;color:#b8002e;margin:6px 0 2px">🎤 GRANDSTAND HEADLINER</div>'+gs
      +'<div style="font-size:11px;font-weight:800;letter-spacing:.06em;color:#5a2e86;margin:14px 0 2px">🎪 EVERY-DAY FAVORITES</div>'+rec
      +'<div style="margin-top:10px;background:#faf7fd;border:1px solid #ece3f7;border-left:3px solid #f0a500;border-radius:12px;padding:10px 12px;font-size:12.5px;color:#4a4356">Full stage-by-stage daily lineup (11 stages) drops here when the Fair publishes 2026 programming.</div>';
  }
  DAYS.forEach(function(d,i){ var dt=new Date(d.iso+'T12:00:00'); var b=document.createElement('button'); b.className='afchip off'; b.textContent=d.dow+' '+(dt.getMonth()+1)+'/'+dt.getDate(); b.onclick=function(){ render(i); }; tabs.appendChild(b); });
  render(0);
})();
</script>
