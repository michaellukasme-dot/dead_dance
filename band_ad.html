<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Band — Rolling Ad</title>
<style>
/* band_ad.html — the per-band rolling ad card for a MusikFest Dead & Jam act. DeadDance palette
   (branded — these are OUR bands). Front = the band; back = a dual-door QR to their event page
   (mf_band.html), which carries the roster, setlist tease, coming-shows + walking directions.
   Flip plays twice per appearance, each QR reveal held ~5s so an external camera can lock on.
   Tap the back to freeze. Rotation weight 3×.  ?band=<slug> (default rift). */
:root{--purple:#2a1b3d;--purple2:#41305c;--rose:#b8002e;--rose2:#e23a5e;--gold:#f0a500;--cream:#f6eefc;--ink:#f6eefc}
html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:#150e20}
@keyframes bf_flip{0%,12%{transform:rotateY(0)}18%,42%{transform:rotateY(180deg)}48%,58%{transform:rotateY(360deg)}64%,88%{transform:rotateY(540deg)}94%,100%{transform:rotateY(720deg)}}
@keyframes bf_aur{0%{transform:translate(-6%,-4%) scale(1.1);opacity:.7}50%{transform:translate(6%,4%) scale(1.25);opacity:1}100%{transform:translate(-6%,-4%) scale(1.1);opacity:.7}}
@keyframes bf_tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes bf_sweep{0%{left:-60%}60%,100%{left:130%}}
@keyframes bf_pulse{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}
.bf-stage{perspective:1300px}
.bf-flip{position:relative;width:300px;height:520px;transform-style:preserve-3d;animation:bf_flip 20s ease-in-out infinite}
.bf-flip.hold{animation:none!important;transform:rotateY(180deg)}
.bf-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:26px;overflow:hidden;
  box-shadow:0 24px 60px rgba(15,10,25,.6),inset 0 0 0 1px rgba(255,255,255,.06);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.bf-front{background:radial-gradient(120% 90% at 50% 0%,var(--purple2) 0%,var(--purple) 58%,#180f26 100%);color:var(--ink);text-decoration:none;display:block}
.bf-back{transform:rotateY(180deg);background:radial-gradient(120% 90% at 50% 0%,var(--purple2) 0%,var(--purple) 58%,#180f26 100%);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;text-decoration:none}
.bf-aur{position:absolute;border-radius:50%;filter:blur(38px);pointer-events:none}
.bf-a1{width:270px;height:270px;top:-50px;left:-40px;background:radial-gradient(circle,#b8002e,transparent 64%);opacity:.55;animation:bf_aur 15s ease-in-out infinite}
.bf-a2{width:240px;height:240px;top:80px;right:-60px;background:radial-gradient(circle,#7a4fbf88,transparent 62%);animation:bf_aur 18s ease-in-out infinite reverse}
.bf-star{position:absolute;width:2px;height:2px;border-radius:50%;background:#f7efff;animation:bf_tw 3.6s ease-in-out infinite}
.bf-rose{position:absolute;top:24px;left:0;right:0;text-align:center;font-size:22px}
.bf-eyebrow{position:absolute;top:58px;left:0;right:0;text-align:center;font-size:10px;font-weight:800;letter-spacing:.26em;color:#e6c7ff}
.bf-brand{position:absolute;top:150px;left:0;right:0;text-align:center;padding:0 20px}
.bf-mark{display:inline-block;position:relative;font-weight:900;font-size:30px;color:var(--cream);line-height:1.06;overflow:hidden}
.bf-kind{margin-top:8px;font-size:12px;font-weight:700;letter-spacing:.02em;color:#cbb6e8}
.bf-sweep{position:absolute;top:0;bottom:0;width:44%;left:-60%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,240,255,.4),transparent);animation:bf_sweep 6.5s ease-in-out infinite}
.bf-set{position:absolute;top:300px;left:0;right:0;text-align:center;padding:0 18px}
.bf-set .k{font-size:10px;font-weight:800;letter-spacing:.28em;color:#f0a500}
.bf-when{margin-top:7px;font-size:15px;font-weight:900;color:#fff}
.bf-where{font-size:11.5px;font-weight:600;color:#b9a9d4;margin-top:3px}
.bf-cta{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,var(--rose2),var(--rose));color:#fff;font-weight:900;font-size:13px;padding:11px 20px;border-radius:999px;white-space:nowrap;animation:bf_pulse 2.8s ease-in-out infinite}
.bf-foot{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:8.5px;font-weight:700;letter-spacing:.06em;color:#8a7fa8}
.bf-back .bk{font-size:10.5px;font-weight:800;letter-spacing:.26em;color:#f0a500}
.bf-back .bmark{font-weight:900;font-size:21px;color:var(--cream);margin-top:5px;padding:0 12px}
.bf-qp{width:208px;height:208px;background:#fbf7ec;border-radius:18px;margin:18px 0 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(0,0,0,.45);overflow:hidden}
.bf-qp #bfQR{width:180px;height:180px;display:flex;align-items:center;justify-content:center}
.bf-back h3{margin:0;font-size:16px;font-weight:900;color:var(--cream)}
.bf-back p{margin:5px 0 0;font-size:12px;color:#c3b4e0;font-weight:600}
.bf-back .cta2{margin-top:15px;background:linear-gradient(180deg,var(--rose2),var(--rose));color:#fff;font-weight:900;font-size:12px;padding:9px 16px;border-radius:999px;max-width:236px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bf-back .hint{font-size:10px;color:#a99ec6;font-weight:700;margin-top:9px}
</style>
</head>
<body>
<div class="bf-stage">
<div class="bf-flip" id="flip" data-ad-weight="3" data-ad="band">
  <a class="bf-face bf-front" id="front" href="#">
    <span class="bf-aur bf-a1"></span><span class="bf-aur bf-a2"></span>
    <span class="bf-star" style="top:44px;left:44px"></span><span class="bf-star" style="top:80px;left:236px;animation-delay:1.1s"></span>
    <span class="bf-star" style="top:130px;left:56px;animation-delay:2s;width:3px;height:3px"></span><span class="bf-star" style="top:120px;left:250px;animation-delay:.7s"></span>
    <div class="bf-rose">🌹</div>
    <div class="bf-eyebrow">DEAD &amp; JAM · MUSIKFEST 2026</div>
    <div class="bf-brand"><span class="bf-mark" id="mark">BAND<span class="bf-sweep"></span></span><div class="bf-kind" id="kind"></div></div>
    <div class="bf-set"><div class="k">— LIVE AT —</div><div class="bf-when" id="when">MusikFest 2026</div><div class="bf-where" id="where"></div></div>
    <span class="bf-cta" id="cta">🌹 Meet the band →</span>
    <div class="bf-foot">POWERED BY ✦ DEADDANCE · flip for the band ⤾</div>
  </a>
  <div class="bf-face bf-back" id="back">
    <div class="bk">◆ THE BAND ◆</div>
    <div class="bmark" id="bmark">BAND</div>
    <div class="bf-qp"><div id="bfQR">▦</div></div>
    <h3>Scan or tap for the band</h3>
    <p>Roster · setlist · coming shows · walk to the stage</p>
    <div class="cta2" id="qurl">deaddance.app</div>
    <div class="hint" id="holdhint">🔒 Tap to hold still, then scan</div>
  </div>
</div>
</div>
<script src="qr.js"></script>
<script src="dd_qrmark.js"></script>
<script src="dd_mf_bands.js"></script>
<script>
function P(k){ return new URLSearchParams(location.search).get(k); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
var slug=(P('band')||'rift').toLowerCase();
var B=(window.DD_MF_BANDS||{})[slug]||(window.DD_MF_BANDS||{})['rift']||{name:'Band',kind:'',set:{}};

/* the band's event page — QR + clickable link both point here */
var base=(location.origin.indexOf('http')===0?location.origin:'https://deaddance.app');
var pageUrl=base+'/mf_band.html?band='+encodeURIComponent(slug);

/* front */
document.getElementById('mark').innerHTML=esc(B.name).toUpperCase()+'<span class="bf-sweep"></span>';
document.getElementById('bmark').textContent=B.name;
document.getElementById('kind').textContent=B.kind||'';
var setTxt = (B.set&&B.set.date) ? fmtDate(B.set.date) : 'MusikFest 2026';
document.getElementById('when').textContent=setTxt;
document.getElementById('where').textContent=[ (B.set&&B.set.stage)||'', B.home||'' ].filter(Boolean).join(' · ')||'Bethlehem, PA';
document.getElementById('front').href=pageUrl;
document.title=B.name+' — Rolling Ad';
var short=pageUrl.replace(/^https?:\/\//,'').replace(/^www\./,''); document.getElementById('qurl').textContent=short.length>30?short.slice(0,30)+'…':short;

function fmtDate(iso){ try{ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }catch(e){ return iso; } }

/* tap the QR side to FREEZE (stop the flip) so an external camera can scan; tap again to resume */
var flip=document.getElementById('flip'), hint=document.getElementById('holdhint');
document.getElementById('back').addEventListener('click',function(e){
  if(e.target&&e.target.closest&&e.target.closest('a')) return;   /* let the QR's own link through */
  e.preventDefault(); var held=flip.classList.toggle('hold');
  if(hint) hint.textContent = held ? '⏸ Held — scan now (tap to resume)' : '🔒 Tap to hold still, then scan'; });

/* the QR — UNBRANDED, full-size, and ALWAYS a clickable link behind it (dual-door: tap to open · scan to share) */
try{ if(window.DDQR&&DDQR.into){ DDQR.into('bfQR', pageUrl, {size:400, css:180, caption:false, mark:false, link:true}); }
     else { document.getElementById('bfQR').textContent='QR'; } }catch(e){ document.getElementById('bfQR').textContent='QR'; }
</script>
</body>
</html>
