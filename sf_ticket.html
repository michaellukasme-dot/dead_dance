<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your Ticket · StageFill</title>
<style>
:root{--accent:#6d28d9}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#12151c;color:#eef1f6;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;color:#1f2430;border-radius:22px;max-width:360px;width:100%;padding:24px;text-align:center;box-shadow:0 20px 60px #0008}
.card h1{font-size:18px;margin:0 0 2px}
.card .sub{color:#8a92a6;font-weight:700;font-size:13px;margin-bottom:14px}
#qr{width:260px;height:260px;background:#fff;border-radius:14px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
.tok{font:700 12px/1.4 ui-monospace,Menlo,monospace;color:#8a92a6;word-break:break-all}
.badge{display:inline-block;background:#eef2fb;color:var(--accent);font-weight:800;font-size:11px;padding:3px 12px;border-radius:999px;margin-top:8px}
.note{color:#8a92a6;font-size:11.5px;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <div class="badge">🎟️ StageFill Ticket</div>
  <h1 style="margin-top:10px">Show this at the door</h1>
  <div class="sub">Staff will scan it to admit you</div>
  <div id="qr">…</div>
  <div class="tok" id="tok"></div>
  <div class="note">Screenshot this to keep it — the code is your entry. One scan admits your party.</div>
</div>
<script src="qr.js"></script>
<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var t=qs('t')||'';
document.getElementById('tok').textContent=t?('#'+t.slice(0,8).toUpperCase()):'No ticket code in this link.';
if(t){ try{ if(window.DDQR&&DDQR.into) DDQR.into('qr',location.origin+'/sf_ticket.html?t='+encodeURIComponent(t),{size:260,css:60,caption:false}); }catch(e){ document.getElementById('qr').textContent=t; } }
</script>
</body>
</html>
