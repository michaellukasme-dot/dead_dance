<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StageFill CRM — the 800</title>
<style>
:root{--ink:#1f2430;--muted:#8a92a6;--line:#e6e8ef;--bg:#f5f6f8;--accent:#2f6feb;--card:#fff;--good:#12a150;--warn:#b7791f}
*{box-sizing:border-box}
html,body{margin:0}
body{font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 70px}
h1{margin:0;font-size:24px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;font-weight:600;margin-top:3px}
.brand{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;font-weight:900;font-size:12px;border-radius:8px;padding:3px 9px}
.controls{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;z-index:5;margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.controls input,.controls select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:13px;background:var(--card);color:var(--ink)}
#q{flex:1;min-width:180px}
.count{font-size:12px;color:var(--muted);font-weight:700;margin:2px 2px 8px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{background:#fafbfc;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:800}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pill{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px}
select.status{border:1px solid var(--line);border-radius:8px;padding:4px 6px;font:inherit;font-size:12px;font-weight:700;background:#fff}
.linkbtn{border:0;background:#eef2fb;color:var(--accent);font-weight:800;font-size:12px;border-radius:8px;padding:6px 9px;cursor:pointer}
.add{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.add input,.add select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;font-weight:800;font-size:13px;padding:9px 14px;cursor:pointer}
.gate{max-width:620px;margin:50px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}
.gate code{display:block;background:#0f1320;color:#8ee6b0;padding:10px 12px;border-radius:10px;margin:12px 0;font-size:12px;word-break:break-all;text-align:left}
.foot{margin-top:20px;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <span class="brand">◆ StageFill</span>
  <h1 style="margin-top:8px">CRM — the 800</h1>
  <div class="sub">Every US festival, direct. Send the Maker link · track the funnel · close before the gates.</div>
  <div id="app"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>try{ var _SFC=window.supabase.createClient("https://vmbqfzxhrqxpwgidogfm.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYnFmenhocnF4cHdnaWRvZ2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDUzODUsImV4cCI6MjA5Nzk4MTM4NX0.aa2guYvXJ7SLAEdYOpDKb6xzHP-ypMpZFPFSdwLc6xM"); window.ddClient=function(){return _SFC;}; }catch(e){}</script>
<script>
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var CATS=[['festival','🎪 Festival'],['band','🎸 Band'],['venue','🏛 Venue'],['other','• Other']];
var STATUSES=['new','sent','opened','building','subscribed','declined'];
var STCOLOR={new:'#eef2fb;color:#2f6feb',sent:'#fff8ea;color:#b7791f',opened:'#eaf3ff;color:#2f6feb',building:'#ecfdf3;color:#12a150',subscribed:'#12a150;color:#fff',declined:'#fbe9e9;color:#c02626'};
var ROWS=[];

function cl(){ return window.ddClient&&ddClient(); }
function makerLink(p){ var b=location.pathname.replace(/[^\/]*$/,''); return location.origin+b+'festival_event_maker.html?n='+encodeURIComponent(p.name||'')+'&c='+encodeURIComponent(p.city||'')+'&s='+encodeURIComponent(p.state||''); }

function boot(){
  var c=cl(); if(!(c&&c.rpc)){ $('app').innerHTML='<div class="gate">Backend offline.</div>'; return; }
  // ensure a session so auth.uid() exists, then check admin
  c.auth.getSession().then(function(r){ if(!(r&&r.data&&r.data.session)) return c.auth.signInAnonymously(); }).then(function(){
    return c.rpc('sf_is_admin');
  }).then(function(r){
    if(r&&!r.error&&r.data===true){ loadCRM(); }
    else { c.auth.getUser().then(function(u){ var uid=(u&&u.data&&u.data.user&&u.data.user.id)||'(sign in)'; gate(uid); }); }
  }).catch(function(){ $('app').innerHTML='<div class="gate">Could not reach the CRM.</div>'; });
}
function gate(uid){
  $('app').innerHTML='<div class="gate"><div style="font-size:38px">🔒</div><h2>Admin only</h2>'
    +'<p style="color:var(--muted)">This CRM is gated to StageFill sales. Add your id below to <code style="display:inline">sf_admin</code> in the Supabase SQL editor, then reload.</p>'
    +'<code>insert into public.sf_admin(uid) values (\''+esc(uid)+'\');</code>'
    +'<button class="btn" onclick="location.reload()">I\'ve added it — reload</button></div>';
}
function loadCRM(){
  $('app').innerHTML=''
    +'<div class="controls">'
    +'<input id="q" placeholder="Search name, city…" oninput="render()">'
    +'<select id="fCat" onchange="render()"><option value="">All categories</option>'+CATS.map(function(x){return '<option value="'+x[0]+'">'+x[1]+'</option>';}).join('')+'</select>'
    +'<select id="fStatus" onchange="render()"><option value="">All statuses</option>'+STATUSES.map(function(s){return '<option>'+s+'</option>';}).join('')+'</select>'
    +'</div><div class="count" id="count"></div><div id="tbl"></div>'
    +'<div class="add"><b style="font-size:12px;color:var(--muted)">Add prospect</b>'
    +'<input id="aName" placeholder="Festival name" style="flex:1;min-width:140px">'
    +'<input id="aCity" placeholder="City" style="width:120px"><input id="aState" placeholder="ST" style="width:60px">'
    +'<select id="aCat">'+CATS.map(function(x){return '<option value="'+x[0]+'">'+x[1]+'</option>';}).join('')+'</select>'
    +'<button class="btn" onclick="addProspect()">Add</button></div>'
    +'<div class="foot">Status auto-saves. “Send link” copies a Festival Maker link that prefills their name/city/state. Counts are internal — never shared.</div>';
  refresh();
}
function refresh(){ var c=cl(); c.rpc('sf_prospect_list',{}).then(function(r){ ROWS=(r&&r.data)||[]; render(); }); }
function render(){
  var q=($('q').value||'').toLowerCase(), fc=$('fCat').value, fs=$('fStatus').value;
  var list=ROWS.filter(function(p){ if(fc&&p.cat!==fc)return false; if(fs&&p.status!==fs)return false;
    if(q){ var h=((p.name||'')+' '+(p.city||'')+' '+(p.state||'')).toLowerCase(); if(h.indexOf(q)<0)return false; } return true; });
  $('count').textContent=list.length+' of '+ROWS.length+' prospects';
  var rows=list.map(function(p){
    var cat=(CATS.filter(function(c){return c[0]===p.cat;})[0]||['','• '+(p.cat||'')])[1];
    return '<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc([p.city,p.state].filter(Boolean).join(', '))+'</td>'
      +'<td class="num">'+(p.attendance?Number(p.attendance).toLocaleString():'—')+'</td>'
      +'<td>'+cat+'</td>'
      +'<td><select class="status" onchange="setStatus(\''+p.id+'\',this.value)">'+STATUSES.map(function(s){return '<option'+(s===p.status?' selected':'')+'>'+s+'</option>';}).join('')+'</select></td>'
      +'<td><button class="linkbtn" onclick="copyLink(\''+p.id+'\')">Send link</button></td></tr>';
  }).join('');
  $('tbl').innerHTML='<table><thead><tr><th>Festival</th><th>Location</th><th class="num">Attendance</th><th>Category</th><th>Status</th><th>Maker link</th></tr></thead><tbody>'
    +(rows||'<tr><td colspan="6" style="color:var(--muted)">No prospects match.</td></tr>')+'</tbody></table>';
}
function setStatus(id,status){ cl().rpc('sf_prospect_upsert',{p:{id:id,status:status}}).then(function(){ var p=ROWS.filter(function(x){return x.id===id;})[0]; if(p)p.status=status; }); }
function copyLink(id){ var p=ROWS.filter(function(x){return x.id===id;})[0]; if(!p)return; var link=makerLink(p);
  try{ navigator.clipboard.writeText(link); alert('Maker link copied for '+p.name+':\n\n'+link); }catch(e){ prompt('Copy the Maker link:',link); }
  if(p.status==='new'){ setStatus(id,'sent'); refresh(); } }
function addProspect(){ var n=($('aName').value||'').trim(); if(!n){ $('aName').focus(); return; }
  cl().rpc('sf_prospect_upsert',{p:{name:n,city:($('aCity').value||'').trim(),state:($('aState').value||'').trim().toUpperCase(),cat:$('aCat').value,status:'new'}})
    .then(function(){ $('aName').value=''; $('aCity').value=''; $('aState').value=''; refresh(); })
    .catch(function(){ alert('Could not add.'); }); }
boot();
</script>
</body>
</html>
