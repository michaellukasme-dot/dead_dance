<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tickets · StageFill</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--ink:#1f2430;--muted:#8a92a6;--line:#e7e9f0;--bg:#f6f7f9;--accent:#6d28d9;--gold:#b8860b;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.bar{background:#2b2b2b;color:#fff;padding:16px 18px;display:flex;align-items:center;gap:14px}
.bar h1{font-size:clamp(18px,4.5vw,24px);margin:0;font-weight:800;letter-spacing:-.01em}
.bar .vn{font-weight:800;opacity:.85;font-size:13px}
.botbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#2b2b2b;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0))}
.botbar .tk{font-size:18px}
.botbar .pw{margin-left:auto;font-size:11.5px;font-weight:800;letter-spacing:.02em;opacity:.85;white-space:nowrap}
.botbar .pw b{color:#c9b3f5}
.botbar .edit{display:inline-flex;align-items:center;gap:7px;background:#ffffff1f;color:#fff;border:0;border-radius:999px;font-weight:800;font-size:12.5px;padding:7px 13px;cursor:pointer}
.botbar .edit .ic{font-size:15px}
.editmenu{position:fixed;left:12px;bottom:56px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px #0004;padding:6px;display:none;min-width:210px}
.editmenu.on{display:block}
.editmenu a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:14px}
.editmenu a:hover{background:#f4f6fa}.editmenu a .em{font-size:18px}
.selbar{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;justify-content:center}
.selbar select{max-width:820px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-weight:800;font-size:14px;color:var(--ink);background:#fff}
#vmap{height:180px;z-index:1;background:#e9edf3}
.wrap{max-width:820px;margin:0 auto;padding:18px 14px 130px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 14px}
.head .n{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px #0000000a}
.date{flex:0 0 auto;width:56px;height:56px;border-radius:12px;background:linear-gradient(160deg,#7c3aed,#6d28d9);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1}
.date .mo{font-size:10px;text-transform:uppercase;letter-spacing:.04em;opacity:.9}
.date .dy{font-size:20px}
.mid{flex:1;min-width:0}
.mid .t{font-weight:800;font-size:15px;letter-spacing:-.01em}
.mid .m{color:var(--muted);font-weight:600;font-size:12.5px;margin-top:2px}
.buy{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#caa23a,#b8860b);color:#3a2a00;border:0;border-radius:999px;font-weight:800;font-size:13px;padding:9px 16px;cursor:pointer;text-decoration:none;box-shadow:0 2px 8px #0002}
.buy.free{background:#eef2fb;color:var(--accent)}
.buy:active{transform:translateY(1px)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.foot a{color:var(--accent);text-decoration:none;font-weight:700}
.pill{display:inline-block;background:#eef2fb;color:var(--accent);font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;margin-left:6px}
.share{position:fixed;right:16px;bottom:64px;background:var(--accent);color:#fff;border:0;border-radius:999px;font-weight:800;font-size:13px;padding:12px 18px;box-shadow:0 6px 20px #0004;cursor:pointer}
.miss{max-width:520px;margin:60px auto;text-align:center;padding:0 20px}
</style>
</head>
<body>
<div class="bar"><span style="font-size:22px">🎟️</span><h1>Tickets</h1><span class="vn" id="vn"></span></div>
<div class="selbar"><select id="vsel" onchange="vSel()"></select></div>
<div id="vmap"></div>
<div class="wrap"><div id="list"></div>
  <div class="foot">Powered by <b>StageFill</b> — this venue's live calendar &amp; box office. Add this link to your website: fans buy in two taps, no app. <a id="allf" href="stagefill_events.html">Browse all events →</a></div>
</div>
<button class="share" onclick="shareVenue()">Share</button>
<div class="botbar"><span id="vedit"></span><span class="pw">Powered by <b>StageFill</b></span></div>
<div class="editmenu" id="editmenu"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>try{ var _SFC=window.supabase.createClient("https://vmbqfzxhrqxpwgidogfm.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYnFmenhocnF4cHdnaWRvZ2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDUzODUsImV4cCI6MjA5Nzk4MTM4NX0.aa2guYvXJ7SLAEdYOpDKb6xzHP-ypMpZFPFSdwLc6xM"); window.ddClient=function(){return _SFC;}; try{ _SFC.auth.getSession().then(function(r){ if(!(r&&r.data&&r.data.session)) _SFC.auth.signInAnonymously(); }); }catch(_e){} }catch(e){}</script>
<script src="sf_calendar_coach.js"></script>
<script>
var SF_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYnFmenhocnF4cHdnaWRvZ2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDUzODUsImV4cCI6MjA5Nzk4MTM4NX0.aa2guYvXJ7SLAEdYOpDKb6xzHP-ypMpZFPFSdwLc6xM", SF_CHECKOUT="https://vmbqfzxhrqxpwgidogfm.supabase.co/functions/v1/sf-checkout";
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function qs(k){ return new URLSearchParams(location.search).get(k); }
function moDy(s){ if(!s)return['',''];var d=new Date(s+'T12:00:00');return[d.toLocaleDateString('en-US',{month:'short'}),String(d.getDate())]; }
function fmtTime(t){ if(!t)return''; var p=t.split(':'),h=+p[0],m=p[1],ap=h<12?'AM':'PM',h12=((h+11)%12)+1; return h12+':'+m+' '+ap; }
var VKEY=qs('v')||'', VENUE=null;

function boot(){ var cl=window.ddClient&&ddClient(); if(!(cl&&cl.rpc)){ setTimeout(boot,300); return; }
  if(!VKEY){ fail("No venue in this link."); return; }
  cl.rpc('sf_venue_get',{p_key:VKEY}).then(function(r){
    if(r&&!r.error&&r.data){ VENUE=r.data; render(); } else { fail("This venue isn't set up yet."); }
  }).catch(function(){ fail("Couldn't load this venue."); }); }

var _vmap=null;
function vSel(){ if($('vsel').value==='national'){ location.href='stagefill_map.html'; } }   // the national roll-up map (chapter balls)
function drawMap(v){ var el=$('vmap'); if(v.lat==null||v.lng==null){ el.style.display='none'; return; }
  el.style.display='block';
  try{ if(_vmap){ _vmap.remove(); _vmap=null; } }catch(e){}
  _vmap=L.map('vmap',{zoomControl:false,attributionControl:false,scrollWheelZoom:false,dragging:true}).setView([v.lat,v.lng],14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,crossOrigin:true}).addTo(_vmap);
  var ic=L.divIcon({className:'',html:'<div style="background:#6d28d9;color:#fff;border-radius:50% 50% 50% 0;width:28px;height:28px;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0006;border:2px solid #fff"><span style="transform:rotate(45deg);font-size:14px">🎟️</span></div>',iconSize:[28,28],iconAnchor:[14,28]});
  L.marker([v.lat,v.lng],{icon:ic,title:v.name}).addTo(_vmap).bindPopup('<b>'+esc(v.name||'')+'</b>');   // ONLY this venue — no other dots
  setTimeout(function(){ _vmap.invalidateSize(); },250);
}
function render(){
  var v=VENUE, evs=v.events||[];
  $('vn').textContent=[v.name,[v.city,v.state].filter(Boolean).join(', ')].filter(Boolean).join(' · ');
  document.title=(v.name||'Venue')+' · Tickets';
  $('vsel').innerHTML='<option value="venue">📍 '+esc(v.name||'This venue')+'</option><option value="national">🇺🇸 StageFill National Calendar</option>';
  drawMap(v);
  if(!evs.length){ $('list').innerHTML='<div class="empty">No upcoming shows posted yet.<br>Check back soon.</div>'; return; }
  var html='<div class="head"><span class="n">'+evs.length+' upcoming show'+(evs.length>1?'s':'')+'</span></div>';
  html+=evs.map(function(e){
    var md=moDy(e.date_start), tt=(e.ticket_types||[]);
    var paid=tt.filter(function(t){return (t.price_cents||0)>0;})[0];
    var free=tt.filter(function(t){return (t.price_cents||0)<=0;})[0];
    var meta=[fmtTime(e.start_time), e.venue].filter(Boolean).join(' · ');
    var btn;
    if(paid){ btn='<button class="buy" data-tt="'+esc(String(paid.id))+'">🎟️ Buy · $'+((paid.price_cents/100).toFixed(0))+'</button>'; }
    else if(free){ btn='<a class="buy free" href="event_page.html?ev='+encodeURIComponent(e.slug)+'">Free · RSVP</a>'; }
    else { btn='<a class="buy free" href="event_page.html?ev='+encodeURIComponent(e.slug)+'">Details</a>'; }
    return '<div class="row"><div class="date"><span class="mo">'+esc(md[0])+'</span><span class="dy">'+esc(md[1])+'</span></div>'
      +'<div class="mid"><div class="t">'+esc(e.name)+'</div><div class="m">'+esc(meta)+'</div></div>'+btn+'</div>';
  }).join('');
  $('list').innerHTML=html;
  // owner-only: the autonomous calendar coach — an expiring Cookie Monster toast → month revenue modal.
  if(v.is_owner && window.SFCoach){ try{ SFCoach.mount({venue:v.name||'your room', city:v.city||'', state:v.state||'', cap:300, ticket:18}); }catch(e){} }
  // owner-only: EDIT / venue-setup mode — an elevation icon on the bottom bar opens the manage menu.
  if(v.is_owner){ mountEdit(v, evs); }
}
function mountEdit(v, evs){
  var mk='festival_event_maker.html?v='+encodeURIComponent(v.name||'')+'&c='+encodeURIComponent(v.city||'')+'&s='+encodeURIComponent(v.state||'');
  $('vedit').innerHTML='<button class="edit" onclick="toggleEdit(event)"><span class="ic">📐</span> Edit venue</button>';
  var door = evs.length ? ('<a href="door.html?ev='+encodeURIComponent(evs[0].slug)+'"><span class="em">🚪</span> Door mode (next show)</a>') : '';
  $('editmenu').innerHTML=
    '<a href="'+mk+'"><span class="em">➕</span> Add / edit a show</a>'+
    '<a href="'+mk+'&teach=floor"><span class="em">🏛️</span> Upload floor plan</a>'+
    door;
}
function toggleEdit(e){ if(e)e.stopPropagation(); $('editmenu').classList.toggle('on'); }
document.addEventListener('click',function(e){ var m=$('editmenu'); if(m&&m.classList.contains('on') && !e.target.closest('#editmenu') && !e.target.closest('#vedit')) m.classList.remove('on'); });
/* delegated BUY — id validated as UUID before checkout (no injection) */
document.addEventListener('click',function(ev){ var b=ev.target&&ev.target.closest&&ev.target.closest('.buy[data-tt]'); if(!b)return;
  var id=b.getAttribute('data-tt')||''; if(!/^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/.test(id))return;
  b.textContent='…'; buy(id,b); });
function buy(ttId,b){ fetch(SF_CHECKOUT,{method:'POST',headers:{'content-type':'application/json','Authorization':'Bearer '+SF_ANON},body:JSON.stringify({ticket_type_id:ttId,qty:1})})
  .then(function(r){return r.json();}).then(function(d){ if(d&&d.url){ location.href=d.url; return; }
    var e=(d&&d.error)||''; alert(e==='sold_out'?(d.available>0?('Only '+d.available+' left.'):'Sold out.'):'Checkout unavailable — try again.'); if(b)b.textContent='🎟️ Buy'; })
  .catch(function(){ alert('Checkout unavailable right now.'); if(b)b.textContent='🎟️ Buy'; }); }
function shareVenue(){ var url=location.href; if(navigator.share){ navigator.share({title:(VENUE&&VENUE.name||'Venue')+' — Tickets',url:url}).catch(function(){}); } else { navigator.clipboard&&navigator.clipboard.writeText(url); alert('Link copied — paste it on your website.'); } }
function fail(msg){ $('list').innerHTML='<div class="miss"><h2>'+esc(msg)+'</h2><p><a href="stagefill_events.html" style="color:#6d28d9;font-weight:800">← Browse all StageFill events</a></p></div>'; }
boot();
</script>
</body>
</html>
