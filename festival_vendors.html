<!--
  festival_vendors.html — VENDOR-GRANULARITY MAP, a reusable surface for %FESTIVAL%.
  Geo-anchored cutesy art (DDCutesyArt → L.imageOverlay bound to the SAME bbox = auto-snaps, resize-safe).
  Each vendor = a container placed on real coordinates; the searchable directory ILLUMINATES the exact spot.
  Parameterized: ?fest=<id>  (seeded: easton_fm = Easton Farmers' Market, real coordinates).
  Beats MarketSpread's map on the one thing it does worst: it does not break on resize/zoom.
-->
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
:root{--ink:#141a22;--bg:#f6f8fa;--card:#fff;--line:#e5e9ef;--muted:#697586;--teal:#0fa3a0;--teal-d:#0b7f7c;--amber:#f59e0b;--ink2:#0f1620}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.top{background:var(--ink2);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:9px;position:relative;z-index:1200}
.top .logo{font-weight:900;font-size:18px;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
.top .logo .b{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,var(--teal),#12c2be);display:grid;place-items:center;color:#04201f;font-weight:900;font-size:14px}
.top .fname{font-weight:700;color:#c7d0dc;font-size:13.5px;margin-left:2px}
.top .cta{margin-left:auto;color:#9fb0c2;font-size:12.5px;font-weight:700;text-decoration:none}
.top .back{color:#fff;background:rgba(255,255,255,.13);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:800;text-decoration:none}
.top .back:hover{background:rgba(255,255,255,.22)}
#wrap{position:absolute;inset:52px 0 0 0}
#map{position:absolute;inset:0;background:#dfe6ee}
/* Vendor directory panel (MarketSpread-style, but ours snaps) */
#dir{position:absolute;top:12px;left:12px;width:300px;max-width:calc(100% - 24px);max-height:calc(100% - 24px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(20,26,34,.16);z-index:1100;display:flex;flex-direction:column;overflow:hidden}
#dir .dh{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);font-weight:800;font-size:14px}
#dir .dh .ct{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700}
#dir .dh .tog{border:0;background:#eef2f6;border-radius:8px;width:26px;height:26px;cursor:pointer;font-weight:800;color:var(--muted)}
#dir .drow{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:#f8fbfc}
#dir .drow .dlab{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
#dir #datepick{flex:1;font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;color:var(--ink)}
#dir #datepick:focus{outline:none;border-color:var(--teal)}
#dir.collapsed .drow{display:none !important}
#dir .srch{padding:10px 12px;border-bottom:1px solid var(--line)}
#dir input{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
#dir input:focus{outline:none;border-color:var(--teal)}
#dir .cats{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
#dir .cat{font-size:11px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 9px;cursor:pointer;color:var(--muted);background:#fff}
#dir .cat.on{background:var(--teal);color:#fff;border-color:var(--teal)}
#dir .list{overflow:auto;flex:1}
#dir .v{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
#dir .v:hover{background:#f4f8fb}
#dir .v.sel{background:#e9faf4}
#dir .dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px}
#dir .v b{font-size:13.5px;font-weight:700;display:block}
#dir .v small{font-size:11.5px;color:var(--muted)}
#dir.collapsed .srch,#dir.collapsed .cats,#dir.collapsed .list{display:none}
.leaflet-container{background:#dfe6ee}
/* Vendor card (registration payoff: logo + proximity ad + premium coupon + sell) */
.vcard{min-width:212px;max-width:250px;font-family:-apple-system,system-ui,sans-serif}
.vc-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:7px}
.vc-logo{width:40px;height:40px;border-radius:9px;flex:none;object-fit:contain;background:#fff;border:1px solid #e5e9ef}
.vc-ini{width:40px;height:40px;border-radius:9px;flex:none;display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px}
.vc-head b{font-size:14px;display:block;line-height:1.15;color:#141a22}
.vc-cat{font-size:11px;color:#697586}
.vc-prem{margin-left:auto;font-size:8.5px;font-weight:900;letter-spacing:.5px;color:#8a5a00;background:#ffe9b3;border-radius:999px;padding:2px 6px;white-space:nowrap}
.vc-ad{font-size:12px;color:#1b2430;background:#eef6f6;border-left:3px solid #0fa3a0;border-radius:6px;padding:5px 8px;margin-bottom:6px}
.vc-coupon{display:flex;gap:7px;align-items:center;border:1.5px dashed #c98a00;background:#fff8e8;border-radius:8px;padding:6px 8px;margin-bottom:7px}
.vc-coupon b{font-size:12px;color:#7a4a00;display:block;line-height:1.2}
.vc-coupon small{font-size:10.5px;color:#a06a15;font-weight:700}
.vc-buy{display:block;text-align:center;background:#0f6f8a;color:#fff;font-weight:800;font-size:12.5px;text-decoration:none;border-radius:9px;padding:9px}
.vc-buy:hover{background:#0b7f7c}
#dir .v .cpn{color:#c98a00;font-weight:900;margin-left:4px}
#dir .v .prm{color:#c07a00;margin-left:3px}
.vlabel{background:#fff;border:1px solid #c9d2dc;border-left-width:4px;border-radius:6px;padding:2px 6px;font:700 11px/1.2 -apple-system,system-ui,sans-serif;color:#1b2430;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.vlabel.lit{outline:3px solid var(--amber);outline-offset:1px;animation:pulse 1s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,158,11,.7)}100%{box-shadow:0 0 0 16px rgba(245,158,11,0)}}
#empty{position:absolute;inset:0;display:none;place-items:center;z-index:1050;padding:24px;text-align:center}
#empty .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;max-width:380px;box-shadow:0 10px 30px rgba(20,26,34,.12)}
#empty h2{margin:0 0 6px;font-size:19px}#empty p{color:var(--muted);font-size:14px;margin:0 0 14px}
#empty a{display:inline-block;background:var(--teal);color:#fff;text-decoration:none;font-weight:800;border-radius:10px;padding:11px 16px}
/* ── Elegance pass: clean pins, hover labels, base toggle ── */
.vpin{position:relative}
.vmark{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#fff;border:2.5px solid var(--c,#334155);box-shadow:0 2px 7px rgba(20,26,34,.32);font-size:14px;line-height:1;cursor:pointer;transition:transform .12s ease}
.vplabel{position:absolute;left:30px;top:50%;transform:translateY(-50%);background:#fff;border:1px solid #dde3ea;border-left:3px solid var(--c,#334155);border-radius:7px;padding:3px 9px;font:700 11.5px/1.25 -apple-system,system-ui,sans-serif;color:#1b2430;white-space:nowrap;box-shadow:0 3px 10px rgba(20,26,34,.18);opacity:0;pointer-events:none;transition:opacity .12s ease;display:none}
.vpin:hover{z-index:1000 !important}
.vpin:hover .vmark{transform:scale(1.22)}
.vpin:hover .vplabel,.vpin.sel .vplabel{opacity:1;display:block}
.vpin.sel{z-index:1001 !important}
.vpin.sel .vmark{transform:scale(1.38);box-shadow:0 0 0 4px rgba(245,158,11,.42),0 2px 7px rgba(20,26,34,.42)}
.zlabel{background:var(--zc,#153042);color:#fff;font:800 11px/1 -apple-system,system-ui,sans-serif;padding:4px 9px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 6px rgba(20,26,34,.3);letter-spacing:.3px}
.mtoggle{position:absolute;top:12px;right:12px;z-index:1100;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:800 12px/1 -apple-system,system-ui,sans-serif;color:var(--ink);box-shadow:0 4px 14px rgba(20,26,34,.16);cursor:pointer;display:flex;align-items:center;gap:7px}
.mtoggle:hover{border-color:var(--teal)}
.mtoggle .sw{width:9px;height:9px;border-radius:50%;background:var(--teal);flex:none}
/* Google-Maps-style category pills, ON the map, horizontally scrollable */
.mappills{position:absolute;top:12px;left:324px;right:150px;z-index:1000;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mappills::-webkit-scrollbar{display:none}
.mappills .cat{flex:none;background:#fff;border:1px solid #e3e7ec;border-radius:999px;padding:8px 13px;font:700 12.5px/1 -apple-system,system-ui,sans-serif;color:#3a444e;box-shadow:0 2px 8px rgba(20,26,34,.16);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:background .1s,color .1s,border-color .1s}
.mappills .cat:hover{border-color:#c3ccd6}
.mappills .cat.on{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 3px 10px rgba(15,163,160,.4)}
@media(max-width:640px){.mappills{left:12px;right:12px;top:auto;bottom:14px}}
.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 12px 30px rgba(20,26,34,.24)}
.leaflet-popup-content{margin:12px 13px}
.leaflet-popup-tip{box-shadow:0 12px 30px rgba(20,26,34,.24)}
.credit{position:absolute;right:8px;bottom:6px;z-index:1100;font-size:11px;color:#6b7684;background:#ffffffcc;border-radius:6px;padding:2px 7px}
</style></head>

/* ---------- helpers ---------- */
function qp(k){ return new URLSearchParams(location.search).get(k); }
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function initials(s){ return String(s||'').replace(/[^A-Za-z ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase(); }
// walk a fraction f in [0,1] along the polyline spine
function ptAlong(spine,f){ var segs=spine.length-1; var s=Math.min(segs-1,Math.floor(f*segs)); var lt=(f*segs)-s; var a=spine[s],b=spine[s+1]; return [a[0]+(b[0]-a[0])*lt, a[1]+(b[1]-a[1])*lt]; }
// perpendicular unit (approx, small-angle) to the local spine direction
function perpAt(spine,f){ var segs=spine.length-1; var s=Math.min(segs-1,Math.floor(f*segs)); var a=spine[s],b=spine[s+1]; var dLat=b[0]-a[0], dLng=b[1]-a[1]; var m=Math.sqrt(dLat*dLat+dLng*dLng)||1; return [-dLng/m, dLat/m]; }
function pointInPoly(lat,lng,poly){ var inside=false; for(var a=0,b=poly.length-1;a<poly.length;b=a++){ var yi=poly[a][0],xi=poly[a][1],yj=poly[b][0],xj=poly[b][1]; if(((yi>lat)!=(yj>lat)) && (lng<(xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside; } return inside; }
/* OBSTACLE PROTOCOL — a placement is invalid if it falls OUTSIDE the footprint OR INSIDE any
   obstacle: river water, a bridge deck, a building… any %OBSTACLE% polygon the Maker declares.
   Such points snap back to the aisle (the spine), so a vendor can never sit in the river or on a bridge. */
function blockedAt(f,lat,lng){ if(f.boundary && !pointInPoly(lat,lng,f.boundary)) return true;
  if(f.obstacles){ for(var o=0;o<f.obstacles.length;o++){ if(f.obstacles[o].poly && pointInPoly(lat,lng,f.obstacles[o].poly)) return true; } } return false; }
function placeVendors(f){ if(!f.spine){ return; } var n=f.vendors.length, off=0.00007;   // explicit-coord fests (zones) skip the spine
  f.vendors.forEach(function(v,i){ if(v.lat!=null && v.lng!=null) return; var t=(i+0.5)/n; var base=ptAlong(f.spine,t); var pp=perpAt(f.spine,t); var side=(i%2?1:-1);
    var lat=base[0]+pp[0]*off*side, lng=base[1]+pp[1]*off*side;
    if(blockedAt(f,lat,lng)){ lat=base[0]; lng=base[1]; }   // clamp off obstacles + inside footprint
    v.lat=lat; v.lng=lng; }); }

// center + zoom the whole grounds onto ONE screen, leaving room for the directory panel
function fitView(noAnim){
  if(!map || !F || !F.bbox) return;

}
function squareAround(lat,lng,d){ return [[lat+d,lng-d],[lat+d,lng+d],[lat-d,lng+d],[lat-d,lng-d]]; }
function fmtDate(iso){ var d=new Date(iso+'T12:00:00'); return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
function isPresent(v){ if(!F.schedule||!SELDATE) return true; var set=PRESENT; return set ? !!set[v.n] : true; }
function pickDate(v){ SELDATE=v; applyDate(); }
function applyDate(){
  PRESENT=null;
  if(F.schedule && SELDATE){ PRESENT={}; (F.schedule[SELDATE]||[]).forEach(function(n){ PRESENT[n]=1; }); }
  updateMapVisibility();
  renderList();
}
// Pills toggle features on the MAP (parks, walking paths, stages, vendors…) — like layers.
function updateMapVisibility(){
  if(!map) return;
  F.vendors.forEach(function(v,i){
    var vis = isPresent(v) && (!ACTIVE_CAT || v.c===ACTIVE_CAT);
    var m=MARKERS[i]; if(m){ if(vis){ if(!map.hasLayer(m)) m.addTo(map); } else if(map.hasLayer(m)) map.removeLayer(m); }
    var pl=PATHLAYERS[i]; if(pl){ pl.forEach(function(ly){ if(vis){ if(!map.hasLayer(ly)) ly.addTo(map); } else if(map.hasLayer(ly)) map.removeLayer(ly); }); }
  });
}
