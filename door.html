<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Door · StageFill</title>
<style>
:root{--ink:#1f2430;--muted:#8a92a6;--line:#2a2f3a;--bg:#12151c;--accent:#6d28d9;--gold:#caa23a;--ok:#12a150;--bad:#e0364a;--card:#1b1f28}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#eef1f6;background:var(--bg)}
.bar{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.bar h1{font-size:16px;margin:0;font-weight:800}
.bar .ev{font-size:12px;color:var(--muted);font-weight:700}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;text-align:center;padding:11px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:14px;cursor:pointer;color:#cfd5e2}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{display:none}.panel.on{display:block}
video{width:100%;border-radius:14px;background:#000;aspect-ratio:3/4;object-fit:cover}
.scanbtn{width:100%;margin-top:10px;padding:12px;border-radius:12px;border:0;font-weight:800;font-size:15px;background:var(--accent);color:#fff;cursor:pointer}
.res{margin-top:12px;border-radius:14px;padding:16px;text-align:center;font-weight:800;font-size:18px;display:none}
.res.ok{display:block;background:rgba(18,161,80,.15);border:1px solid var(--ok);color:#5be89a}
.res.bad{display:block;background:rgba(224,54,74,.15);border:1px solid var(--bad);color:#ff8a9a}
.res.warn{display:block;background:rgba(202,162,58,.15);border:1px solid var(--gold);color:#e8cf86}
.provbtn{width:100%;margin-top:8px;padding:9px;border-radius:10px;border:1px solid var(--line);background:#232836;color:#cfd5e2;font-weight:800;font-size:12.5px;cursor:pointer;display:none}
.provbox{margin-top:8px;font-size:11.5px;line-height:1.55;color:#aeb6c6;background:#12151c;border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:none;white-space:pre-wrap;word-break:break-word}
.res small{display:block;font-weight:600;font-size:13px;color:var(--muted);margin-top:4px}
.tt{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;color:#eef1f6;font-weight:800;font-size:15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.tt .p{color:var(--gold)}
.hint{color:var(--muted);font-size:12.5px;margin:2px 2px 12px}
.miss{max-width:460px;margin:60px auto;text-align:center;padding:0 20px;color:#cfd5e2}
/* tender sheet */
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:50}
.sheet.on{display:flex}
.sheetc{background:#1b1f28;width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0));border:1px solid var(--line)}
.sheetc h3{margin:0 0 4px;font-size:16px}
.tender{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#232836;color:#fff;font-weight:800;font-size:15px;margin-top:9px;cursor:pointer;text-align:left}
.tender small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}
.qrbox{text-align:center;padding:8px}
.qrbox #qr{width:240px;height:240px;background:#fff;border-radius:12px;margin:8px auto;display:flex;align-items:center;justify-content:center}
.x{float:right;background:0;border:0;color:var(--muted);font-size:22px;cursor:pointer}
.step{display:inline-flex;align-items:center;gap:8px;margin-top:6px}
.step button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#232836;color:#fff;font-size:20px;font-weight:800;cursor:pointer}
.step b{min-width:28px;text-align:center;font-size:18px}
</style>
</head>
<body>
<div class="bar"><span style="font-size:20px">🚪</span><div><h1>Door Mode</h1><div class="ev" id="ev">…</div></div></div>
<div class="wrap" id="wrap"><p class="hint">Loading…</p></div>

<div class="sheet" id="sheet"><div class="sheetc" id="sheetc"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>try{ var _SFC=window.supabase.createClient("https://vmbqfzxhrqxpwgidogfm.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYnFmenhocnF4cHdnaWRvZ2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDUzODUsImV4cCI6MjA5Nzk4MTM4NX0.aa2guYvXJ7SLAEdYOpDKb6xzHP-ypMpZFPFSdwLc6xM"); window.ddClient=function(){return _SFC;}; try{ _SFC.auth.getSession().then(function(r){ if(!(r&&r.data&&r.data.session)) _SFC.auth.signInAnonymously(); }); }catch(_e){} }catch(e){}</script>
<script src="qr.js"></script>
<script src="dd_ticketsec.js"></script><!-- ticket-security brain: parse/redeem/verify/prov (guarded, .then-chained) -->
<script>
var SF_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYnFmenhocnF4cHdnaWRvZ2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDUzODUsImV4cCI6MjA5Nzk4MTM4NX0.aa2guYvXJ7SLAEdYOpDKb6xzHP-ypMpZFPFSdwLc6xM", SF_CHECKOUT="https://vmbqfzxhrqxpwgidogfm.supabase.co/functions/v1/sf-checkout";
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function qs(k){ return new URLSearchParams(location.search).get(k); }
var SLUG=qs('ev')||'', EV=null, TT=[];

function boot(){ var cl=window.ddClient&&ddClient(); if(!(cl&&cl.rpc)){ setTimeout(boot,300); return; }
  if(!SLUG){ miss("Open Door Mode from your event (no event in link)."); return; }
  cl.rpc('sf_get',{p_slug:SLUG}).then(function(r){
    if(!(r&&!r.error&&r.data&&r.data.event)){ miss("Event not found."); return; }
    var d=r.data; EV=d.event; TT=(d.ticket_types||[]);
    $('ev').textContent=EV.name||'';
    if(!EV.is_owner){ miss("Door Mode is for the event owner. Open it on the device you built this event with (same browser)."); return; }
    ui();
  }).catch(function(){ miss("Couldn't load the event."); }); }

function ui(){
  $('wrap').innerHTML=''
   +'<div class="tabs"><div class="tab on" id="tCheck" onclick="tab(\'check\')">📷 Check-in</div><div class="tab" id="tSell" onclick="tab(\'sell\')">🎟️ Sell at door</div></div>'
   +'<div class="panel on" id="pCheck">'
     +'<video id="vid" playsinline muted></video>'
     +'<button class="scanbtn" id="scanBtn" onclick="toggleScan()">Start scanning</button>'
     +'<div class="res" id="res"></div>'
     +'<button class="provbtn" id="provBtn" onclick="provPeek()">🔎 See this ticket\'s provenance (audit)</button>'
     +'<div class="provbox" id="provBox"></div>'
     +'<p class="hint">Point at a fan\'s ticket QR. A green ✓ admits them; amber = already used; RED = forged, do not admit. Live tickets show a rotating code that refreshes every ~15s — a screenshot goes stale (“Expired code — refresh”) within ~30s. Signatures and single-use are verified on the server.</p>'
   +'</div>'
   +'<div class="panel" id="pSell">'
     +'<p class="hint">Pick a ticket, then take payment. Card = fan scans &amp; pays on their own phone (Apple/Google Pay or card). Cash = you take the money, we issue the ticket.</p>'
     +(TT.length?TT.map(function(t){var pr=(t.price_cents||0);return '<button class="tt" data-tt="'+esc(String(t.id))+'"><span>'+esc(t.name)+'</span><span class="p">'+(pr>0?('$'+(pr/100).toFixed(0)):'Free')+'</span></button>';}).join(''):'<p class="hint">No ticket types on this event yet.</p>')
   +'</div>';
}
function tab(which){ var c=which==='check';
  $('tCheck').classList.toggle('on',c); $('tSell').classList.toggle('on',!c);
  $('pCheck').classList.toggle('on',c); $('pSell').classList.toggle('on',!c);
  if(!c) stopScan(); }

/* ---------- QR check-in scanner (jsQR + camera) ---------- */
var stream=null, scanning=false, raf=null, cv=document.createElement('canvas'), ctx=cv.getContext('2d'), _cool=0;
function toggleScan(){ scanning?stopScan():startScan(); }
function startScan(){ var v=$('vid');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(s){ stream=s; v.srcObject=s; v.play(); scanning=true; $('scanBtn').textContent='Stop scanning'; loop(); })
  .catch(function(){ banner('bad','Camera blocked','Allow camera access to scan tickets.'); }); }
function stopScan(){ scanning=false; if(raf)cancelAnimationFrame(raf); if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;} var b=$('scanBtn'); if(b)b.textContent='Start scanning'; }
function loop(){ if(!scanning)return; var v=$('vid');
  if(v.readyState===v.HAVE_ENOUGH_DATA){ cv.width=v.videoWidth; cv.height=v.videoHeight; ctx.drawImage(v,0,0,cv.width,cv.height);
    try{ var img=ctx.getImageData(0,0,cv.width,cv.height); var code=jsQR(img.data,img.width,img.height); if(code&&code.data&&Date.now()>_cool){ _cool=Date.now()+2500; onScan(code.data); } }catch(e){} }
  raf=requestAnimationFrame(loop); }
function tokenFrom(s){ try{ if(s.indexOf('http')===0){ var u=new URL(s); return u.searchParams.get('t')||''; } }catch(e){} return String(s||'').trim(); }
var _lastSecureTok=null;   // last scanned TIX token (for the provenance peek)
function onScan(data){
  // ROTATING secure ticket (TIXR:id:step:code)? — the LIVE SafeTix-style code. Check FIRST:
  // a TIXR token would false-match parseToken, so rotating must win. Routes to sf_ticket_redeem_rot.
  var rot=null; try{ rot=(window.DDTicketSec&&DDTicketSec.parseRot&&DDTicketSec.parseRot(data))||null; }catch(e){}
  if(rot){ redeemSecure(String(data), true); return; }
  // STATIC (HMAC-signed) ticket (TIX:id:sig)?  Route through the ticket-security spine (sf_ticket_redeem).
  var sec=null; try{ sec=(window.DDTicketSec&&DDTicketSec.parseToken(data))||null; }catch(e){}
  if(sec){ redeemSecure(String(data), false); return; }
  _lastSecureTok=null; hideProv();
  var tok=tokenFrom(data); if(!tok){ banner('bad','Not a ticket',''); return; }
  var cl=ddClient(); cl.rpc('sf_checkin',{p_token:tok}).then(function(r){ var d=r&&r.data||{};
    if(d.status==='ok'){ beep(); banner('ok','✓ Admit — '+(d.qty>1?d.qty+'× ':'')+esc(d.name||'Ticket'), esc(d.event||'')); }
    else if(d.status==='used'){ banner('warn','Already used', 'Checked in '+fmtAt(d.at)); }
    else if(d.status==='unpaid'){ banner('bad','Not paid',''); }
    else if(d.status==='not_staff'){ banner('bad','Wrong event','This ticket isn\'t for your event.'); }
    else { banner('bad','Invalid ticket',''); }
  }).catch(function(){ banner('bad','Check-in failed','Try again.'); }); }

// staff token for THIS event — held by the door owner (never embedded in a ticket). Prompt once,
// claim it on the server (TOFU), reuse it for every paid redemption. Free tickets never need it.
function doorStaff(){ var k='dd.door.staff.'+SLUG, t=''; try{ t=localStorage.getItem(k)||''; }catch(e){}
  if(!t){ try{ t=(prompt('Set this event\'s STAFF TOKEN (a shared secret only door staff know — needed to admit PAID tickets):')||'').trim(); }catch(e){ t=''; }
    if(t){ try{ localStorage.setItem(k,t); }catch(e){}
      try{ if(window.DDTicketSec) DDTicketSec.staffClaim(SLUG,t,(EV&&EV.id)||'door'); }catch(e){} } }
  return t||null; }
// redeem a secure ticket. HMAC + single-use verified SERVER-SIDE; banner reflects the REAL result only.
// isRot=true → a LIVE rotating code (sf_ticket_redeem_rot: staleness + authenticity + single-use);
// isRot=false → the static signed token (sf_ticket_redeem). Either way the CLIENT never asserts admit.
function redeemSecure(rawTok, isRot){ _lastSecureTok=rawTok; hideProv();
  if(!window.DDTicketSec){ banner('bad','Security brain not loaded',''); return; }
  banner('warn','Checking…', isRot?'Verifying the live rotating code on the server.':'Verifying signature on the server.');
  var by=(EV&&EV.id)||'door';
  var go=function(here){
    var opts={staffToken:doorStaff(),lat:here&&here[0],lng:here&&here[1],by:by};
    var pr=(isRot && DDTicketSec.redeemRot) ? DDTicketSec.redeemRot(rawTok,opts) : DDTicketSec.redeem(rawTok,opts);
    pr.then(function(res){
      var h=DDTicketSec.humanStatus(res); banner(h.tone, h.label, h.sub);
      if(h.tone==='ok') beep();
      var pb=$('provBtn'); if(pb) pb.style.display='block';   // audit is available for any scanned ticket
    }); };
  // one best-effort geo fix (never blocks the admit)
  try{ if(navigator.geolocation){ navigator.geolocation.getCurrentPosition(
        function(p){ go([p.coords.latitude,p.coords.longitude]); },
        function(){ go(null); }, {enableHighAccuracy:true,timeout:3000,maximumAge:60000}); }
      else go(null); }catch(e){ go(null); } }
function provPeek(){ if(!_lastSecureTok||!window.DDTicketSec){ return; }
  var box=$('provBox'); if(!box) return; box.style.display='block'; box.textContent='Loading audit…';
  DDTicketSec.prov(_lastSecureTok).then(function(rows){
    var lines=DDTicketSec.formatProv(rows); box.textContent = lines.length? lines.join('\n') : 'No provenance recorded yet.'; }); }
function hideProv(){ var pb=$('provBtn'), box=$('provBox'); if(pb)pb.style.display='none'; if(box){box.style.display='none';box.textContent='';} }
function banner(kind,msg,sub){ var el=$('res'); el.className='res '+kind; el.innerHTML=esc(msg)+(sub?'<small>'+sub+'</small>':''); }
function fmtAt(s){ try{ return new Date(s).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }
function beep(){ try{ var a=new (window.AudioContext||window.webkitAudioContext)(); var o=a.createOscillator(); o.frequency.value=880; o.connect(a.destination); o.start(); setTimeout(function(){o.stop();a.close();},120); }catch(e){} }

/* ---------- Sell at door ---------- */
document.addEventListener('click',function(ev){ var b=ev.target&&ev.target.closest&&ev.target.closest('.tt[data-tt]'); if(!b)return;
  var id=b.getAttribute('data-tt')||''; if(!/^[0-9a-fA-F-]{36}$/.test(id))return; sellSheet(id); });
function sellSheet(ttId){ var t=TT.filter(function(x){return x.id===ttId;})[0]||{}; var pr=(t.price_cents||0);
  $('sheetc').innerHTML='<button class="x" onclick="closeSheet()">✕</button><h3>'+esc(t.name||'Ticket')+'</h3><div class="hint">'+(pr>0?('$'+(pr/100).toFixed(0)+' each'):'Free')+'</div>'
    +(pr>0?('<button class="tender" onclick="scanToPay(\''+ttId+'\')">💳 Card — Scan to Pay<small>Fan scans a code and pays on their own phone (Apple/Google Pay or card).</small></button>'
           +'<button class="tender" onclick="cashSheet(\''+ttId+'\')">💵 Cash<small>You take the cash; we issue the ticket + a check-in QR.</small></button>')
      :'<button class="tender" onclick="cashIssue(\''+ttId+'\',1)">✅ Admit (free ticket)</button>');
  openSheet(); }
function cashSheet(ttId){ window._qty=1; $('sheetc').innerHTML='<button class="x" onclick="closeSheet()">✕</button><h3>Cash sale</h3>'
    +'<div class="hint">How many?</div><div class="step"><button onclick="qadj(-1)">–</button><b id="q">1</b><button onclick="qadj(1)">+</button></div>'
    +'<button class="tender" style="margin-top:14px;background:var(--ok);border-color:var(--ok)" onclick="cashIssue(\''+ttId+'\',window._qty)">💵 Take cash &amp; issue</button>'; }
function qadj(d){ window._qty=Math.max(1,Math.min(20,(window._qty||1)+d)); $('q').textContent=window._qty; }
function cashIssue(ttId,qty){ var cl=ddClient(); cl.rpc('sf_issue_ticket',{p_event:EV.id,p_tt:ttId,p_qty:qty,p_tender:'cash'}).then(function(r){ var d=r&&r.data||{};
  if(d.ok){ ticketQR(d.token, (d.qty>1?d.qty+'× ':'')+(d.name||'Ticket')); }
  else { alert(d.error==='sold_out'?'Sold out.':(d.error==='not_staff'?'Only the event owner can sell here.':'Could not issue — try again.')); } })
  .catch(function(){ alert('Could not issue — try again.'); }); }
function ticketQR(token,label){ var url=location.origin+'/sf_ticket.html?t='+encodeURIComponent(token);
  $('sheetc').innerHTML='<button class="x" onclick="closeSheet()">✕</button><h3>✅ Sold — admit the fan</h3><div class="hint">'+esc(label)+'. Fan can screenshot this as their ticket.</div><div class="qrbox"><div id="qr">…</div></div>';
  try{ if(window.DDQR&&DDQR.into) DDQR.into('qr',url,{size:240,css:60,caption:false}); }catch(e){ $('qr').textContent=token; } }
function scanToPay(ttId){ $('sheetc').innerHTML='<button class="x" onclick="closeSheet()">✕</button><h3>Scan to Pay</h3><div class="hint">Getting a secure link…</div>';
  fetch(SF_CHECKOUT,{method:'POST',headers:{'content-type':'application/json','Authorization':'Bearer '+SF_ANON},body:JSON.stringify({ticket_type_id:ttId,qty:1})})
   .then(function(r){return r.json();}).then(function(d){ if(d&&d.url){ $('sheetc').innerHTML='<button class="x" onclick="closeSheet()">✕</button><h3>💳 Fan scans to pay</h3><div class="hint">Apple/Google Pay or card — on their phone. No card touches you.</div><div class="qrbox"><div id="qr">…</div></div>'; try{ if(window.DDQR&&DDQR.into) DDQR.into('qr',d.url,{size:240,css:60,caption:false}); }catch(e){} }
     else { $('sheetc').innerHTML='<button class="x" onclick="closeSheet()">✕</button><h3>Unavailable</h3><div class="hint">'+esc((d&&d.error)||'Try again.')+'</div>'; } })
   .catch(function(){ $('sheetc').innerHTML='<button class="x" onclick="closeSheet()">✕</button><h3>Unavailable</h3><div class="hint">Network error — try again.</div>'; }); }
function openSheet(){ $('sheet').classList.add('on'); }
function closeSheet(){ $('sheet').classList.remove('on'); }
$('sheet').addEventListener('click',function(e){ if(e.target===$('sheet')) closeSheet(); });

function miss(m){ $('wrap').innerHTML='<div class="miss"><h2 style="font-size:18px">'+esc(m)+'</h2></div>'; }
boot();
</script>
</body>
</html>
