<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StageFill — City Plan</title>
<meta name="theme-color" content="#0f1620">
<!-- module_pricing.html — NEW PLAN. Parks & Rec is the CITY-level module (the way in), $199/mo —
     ~25% under the parks-only competition. Every other module (Farmers Market, BaconFest, West Ward,
     Public Market, Library, …) is $99/mo flat. Multiple entry points: a city can start at the City
     level ($199) OR at any single sub-map ($99) without the city. Land at any door. -->
<style>
:root{--ink:#141a22;--bg:#eef1f5;--card:#fff;--line:#e3e8ee;--muted:#6b7684;--teal:#0fa3a0;--teal-d:#0b7f7c;--amber:#b7791f;--ink2:#0f1620}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.top{background:var(--ink2);color:#fff;padding:11px 16px;display:flex;align-items:center;gap:10px}
.top .b{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--teal),#12c2be);display:grid;place-items:center;color:#04201f;font-weight:900}
.top b{font-size:17px}.top .s{color:#9fb0c2;font-size:12px;font-weight:700;margin-left:auto}
.hero{background:radial-gradient(120% 130% at 85% -30%,#1b3b52,#0f1620);color:#fff;padding:18px}
.hero h1{margin:0 0 3px;font-size:20px}.hero p{margin:0;color:#b9c6d4;font-size:13px}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px;display:grid;grid-template-columns:1fr 300px;gap:20px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.cityrow{display:flex;align-items:center;gap:13px;border:2px solid var(--teal);background:linear-gradient(120% 120% at 90% 0,#eafaf9,#fff);border-radius:14px;padding:14px 16px;cursor:pointer;margin-bottom:14px}
.cityrow input{width:20px;height:20px;accent-color:var(--teal);flex:none}
.cityrow .nm{flex:1}.cityrow .nm b{font-size:15px}.cityrow .nm small{display:block;color:var(--muted);font-size:12px}
.cityrow .pr{font-weight:900;font-size:19px;color:var(--teal-d);font-variant-numeric:tabular-nums}
.cityrow .pr small{font-size:11px;color:var(--amber);font-weight:800;display:block;text-align:right}
.h2{margin:6px 2px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 4px}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}.mrow input{width:18px;height:18px;accent-color:var(--teal);flex:none}
.mrow .nm{flex:1;font-weight:700;font-size:13.5px}.mrow .pr{font-weight:800;color:var(--teal-d);font-variant-numeric:tabular-nums;font-size:13px}
.res{position:sticky;top:14px;align-self:start}
.big{background:linear-gradient(135deg,#153042,#0f6f8a);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:12px}
.big .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#bcd0dd}
.big .v{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:2px}
.big .v small{font-size:14px;font-weight:700;color:#cfe0ea}.big .sm{font-size:12px;color:#cfe0ea;margin-top:5px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}
.rrow{display:flex;justify-content:space-between;padding:4px 0}.rrow b{font-variant-numeric:tabular-nums}
.pill{display:inline-block;background:#eef4f4;color:var(--teal-d);font-weight:800;font-size:11px;border-radius:999px;padding:2px 8px}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5}
</style></head>
<body>
<div class="top"><span class="b">◍</span><b>StageFill</b><span class="s">City Plan · Easton</span></div>
<div class="hero"><h1>Build your city's plan</h1><p>Parks &amp; Rec is the way in — the city's own map. Every event and program rides on top of it.</p></div>
<div class="wrap">
  <div>
    <label class="cityrow"><input type="checkbox" id="city" checked onchange="calc()">
      <span class="nm"><b>🏛️ City Level — Parks &amp; Rec + Facilities</b><small>The whole city: parks, trails, pools, fields, courts, libraries, restrooms — the Facilities department's map</small></span>
      <span class="pr">$199<small>~25% under competition</small></span></label>
    <div class="h2">Programs &amp; events — $99/mo each · start with any one, with or without the City</div>
    <div class="panel" id="modules"></div>
  </div>
  <div class="res">
    <div class="big"><div class="k">Total / month</div><div class="v" id="permo"></div><div class="sm" id="peryr"></div></div>
    <div class="rcard">
      <div class="rrow"><span>City Level (P&amp;R)</span><b id="rcity">—</b></div>
      <div class="rrow"><span>Program modules</span><b id="rmods">0</b></div>
      <div class="rrow"><span>Modules subtotal</span><b id="rmodsum">$0</b></div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
var CITY=199, MOD=99;
var MODULES=[
 {id:"easton_fm",n:"Easton Farmers' Market"},{id:"pa_bacon_fest",n:"PA Bacon Fest"},
 {id:"west_ward",n:"West Ward (Easton zone)"},{id:"easton_public_market",n:"Easton Public Market"},
 {id:"easton_main",n:"Easton Main Street"},{id:"live_at_the_falls",n:"Live at the Falls"},
 {id:"public_library",n:"Easton Public Library"},{id:"easton_ambassadors",n:"Easton Ambassadors"},
 {id:"easton_garden_works",n:"Easton Garden Works"},{id:"easton_criterium",n:"Easton Criterium"},
 {id:"easton_heritage_day",n:"Easton Heritage Day"},{id:"easton_winter_village",n:"Easton Winter Village"},
 {id:"spring_into_easton",n:"Spring Into Easton"}
];
function money(n){return '$'+Math.round(n).toLocaleString('en-US');}
var picked={};
function render(){
  document.getElementById('modules').innerHTML=MODULES.map(function(m){
    return '<label class="mrow"><input type="checkbox" '+(picked[m.id]?'checked':'')+' onchange="tog(\''+m.id+'\')"><span class="nm">'+m.n+'</span><span class="pr">$'+MOD+'</span></label>';
  }).join('');
  calc();
}
function tog(id){ picked[id]=!picked[id]; calc(); }
function calc(){
  var cityOn=document.getElementById('city').checked;
  var n=MODULES.filter(function(m){return picked[m.id];}).length;
  var modsum=n*MOD, total=(cityOn?CITY:0)+modsum;
  document.getElementById('permo').innerHTML=money(total)+'<small> /mo</small>';
  document.getElementById('peryr').textContent=money(total*12)+' / year';
  document.getElementById('rcity').textContent=cityOn?money(CITY):'—';
  document.getElementById('rmods').textContent=n;
  document.getElementById('rmodsum').textContent=money(modsum);
  var all=CITY+MODULES.length*MOD;
  document.getElementById('note').innerHTML=
    (!cityOn && n>0 ? '<span class="pill">side door</span> A program can start on StageFill for '+money(MOD)+'/mo <b>without</b> the City — multiple entry points, we land at any door.<br><br>' : '')+
    'Parks &amp; Rec is a funded city department (Facilities), so the City Level is a real budget line at '+money(CITY)+' — and about 25% under a parks-only competitor. Everything else is '+money(MOD)+'. All of Easton — City + every program — tops out at <b>'+money(all)+'/mo</b> ('+money(all*12)+'/yr), still covered by Main Street Matters.';
}
render();
</script>
</body></html>
